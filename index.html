"stage": "初识期", "subtext": "典型的初识“废物测试”！说明你刚才的话戳中她让她开心了，但她又怕你是广撒网的老手，在测试你会不会慌张自证。", "trigger": "聊得挺开心，女生突然调侃：“你这么会说，平时没少跟女生这么聊吧？”", "warm_reply": "哪有，会说话也是分人的呀。遇到敷衍冷淡的人我半句都懒得多讲，主要是跟你聊天氛围很舒服，不知不觉话就多了。", "category": "初识破冰", "ch_num": 2, "id": "S051"}, {"bad_reply": "“你怎么光回嗯嗯啊，是不是不想跟我聊天？”——怨妇式质问直接把天聊僵，显得玻璃心又难相处。", "confident_reply": "把天聊成单机模式算我的锅哈哈，看来你这会儿在忙，我先去处理点事，回头有空聊个你感兴趣的话题。", "followup_tip": "幽默点破或体面给台阶后看她反应：如果她不好意思地解释“刚在忙事”并认真回复，顺势换轻松话题；如果依然回单字，果断停聊两天保住价值。", "humorous_reply": "我差点以为刚才连上Siri了，喊一句才乖乖应一声哈哈～是不是这会儿正忙着呢？", "keywords": ["哈哈", "嗯嗯", "哦", "敷衍", "高冷", "接不住"], "stage": "初识期", "subtext": "要么是你聊的话题太干巴她实在不知道怎么接，要么是她这会儿心不在焉；硬找话题热脸贴冷屁股只会越聊越低微。", "trigger": "刚认识聊天，女生总是敷衍简短回：“哈哈” / “嗯嗯” / “哦”，怎么破冰不卑微？", "warm_reply": "看你回得这么精简，猜你今天八成是累坏了不想打字吧？累了就先歇会儿不用勉强回，空了咱们再聊好玩的～", "category": "初识破冰", "ch_num": 2, "id": "S052"}, {"bad_reply": "“别提了，我前任特别作还物质，全是她的问题伤透我了！”——数落前任和卖惨是初识大忌，女生会本能代入“以后吵架你也会这么骂我”。", "confident_reply": "早就彻底翻篇了，性格和节奏不太合适就体面分开了。我觉得过去不重要，重要的是每段感情都问心无愧，把最好的状态留给下一段，你觉得呢？", "followup_tip": "聊前任牢记12字真言：“早已翻篇、客观归因、懂得珍惜”。两句话答完立刻用最后半句把焦点拉回当下或未来择偶观，绝不深聊前任细节。", "humorous_reply": "翻篇挺久啦，当时主要是两个人对未来的节奏没对上频道，和平散场各自安好。现在的内存条已经清空，只装当下的开心事～", "keywords": ["前任", "分手原因", "感情史", "上一段恋爱", "谈过几个"], "stage": "初识期", "subtext": "她在通过你评价前任的态度，暗中考察你的情绪稳定性、人品担当以及你是否还对旧人念念不忘。", "trigger": "初识聊天女生突然问：“你上一段恋爱谈了多久？为什么分手呀？”", "warm_reply": "分开有一阵子了，主要是后来工作和生活规划慢慢走散了，谁也没错。那段经历最大的收获，就是让我更懂得以后怎么去体谅和珍惜眼前人。", "category": "初识破冰", "ch_num": 2, "id": "S053"}, {"bad_reply": "“那你家里几口人呀？平时几点下班？周末一般干嘛？”——夺命连环盘问到底，像极了派出所做笔录，把仅存的好感彻底耗光。", "confident_reply": "基本情况对上暗号啦，不聊枯燥的工作了。看你说话的节奏挺利落的，猜你平时应该是个很有主见的姑娘，猜对没？", "followup_tip": "人最喜欢听别人聊“关于自己的印象猜测”（巴纳姆效应）！不管你猜对猜错，她都会兴致勃勃地纠正或认同，话匣子立刻打开。", "humorous_reply": "打住打住，再这么问下去咱俩像在办居委会登记了哈哈～换个好玩的，凭直觉盲猜一下，你是偏慢热的I人还是社牛E人？", "keywords": ["查户口", "一问一答", "换话题", "干聊", "MBTI", "不知道聊啥"], "stage": "初识期", "subtext": "一问一答超过三轮双方都会感到社交疲惫，主动自嘲点破“查户口”并切换到带趣味猜测的话题，她会瞬间松一口气。", "trigger": "刚问完住哪、做什么工作，眼看变成“查户口”一问一答，怎么丝滑换话题？", "warm_reply": "刚聊完工作感觉都快有班味儿了哈哈。抛开每天上班赚钱不谈，如果给你放一周假不用管任何杂事，你最想干嘛去？", "category": "初识破冰", "ch_num": 2, "id": "S054"}, {"bad_reply": "“怎么不说话了？发个表情包暖暖场！”——刻意点破尴尬却没提供任何新话头，场面只会更加死寂。", "confident_reply": "趁这会儿闲聊提前跟你约法三章哈：我这人有时候说话直，要是哪句没接好你直接拍我，千万别在心里默默给我扣分，成交不？", "followup_tip": "问“什么事让你加分/什么样的礼物对你有意义”等于直接拿她的攻略开卷考试！认真记住她的答案，顺口接一句“拿小本本记下了”，好感度拉满。", "humorous_reply": "先采访一下，今天心情怎么样？听说女生心情不好的时候男生呼吸都是错的，心情还行的话我就放心大胆聊了哈哈～", "keywords": ["冷场", "没话聊", "话题库", "救场", "沉默", "找话题"], "stage": "初识期", "subtext": "冷场时硬憋冷笑话最尴尬，不如直接从她的情绪状态或内心偏好切入——每个人都爱聊自己的喜好与感受，还能顺便让你“抄答案”。", "trigger": "聊着聊着突然冷场没词了，抛什么“开卷考”话题能立刻激活她的分享欲？", "warm_reply": "刚刚突然好奇一个问题，平时相处里，什么样的细节或者小事最容易让你觉得有安全感、很加分呀？", "category": "初识破冰", "ch_num": 2, "id": "S055"}, {"bad_reply": "“谁上班不累啊，忍忍就过去了，多喝点热水早点睡吧。”——爹味说教加敷衍直男语录，瞬间让她后悔跟你说这句。", "confident_reply": "辛苦啦，今天先彻底罢工歇着。这种槽点满满的糟心事隔着屏幕打字不过瘾，攒一攒，周末带你去吃顿热乎火锅当面痛快吐槽！", "followup_tip": "接负面情绪两步走：先情绪站队（“换作我比你还冲动”），再把低落情绪引向具体的美食治愈或周末约饭，切忌帮她讲道理分析对错。", "humorous_reply": "听着都替你生气，换作是我估计当场比你还冲动！不过老天让你今天受点小委屈，肯定是为了把好运攒到周末吃顿好的，想吃啥去去晦气？", "keywords": ["上班好累", "好累", "不想动", "吐槽", "心情烦", "安慰"], "stage": "初识期", "subtext": "她找你喊累吐槽不是让你分析职场道理，而是想要“无条件偏袒的情绪共鸣”，顺便给你一个关心她、甚至约她吃顿好的机会！", "trigger": "女生发消息说：“今天上班好累啊，不想动了”（或吐槽奇葩同事/糟心事）", "warm_reply": "抱抱辛苦打工的你～今天肯定消耗了不少精力吧，今晚啥都别想了，点份最爱吃的外卖瘫着追会儿剧，天大的事明天再说。", "category": "初识破冰", "ch_num": 2, "id": "S056"}, {"bad_reply": "“早安！今天天气不错记得按时吃早饭哦～”——微商群发式机器人打卡，连续发三天直接沦为无聊背景板。", "confident_reply": "今天心情不错，刚去买菜准备亲自下厨整两个拿手菜。突然想到，要是你也在应该会喜欢这个口味，你平时爱吃家常菜吗？", "followup_tip": "发这类话术时，最好提前随手拍一张真实的美食、咖啡、晚霞或街景照片配着发出去，具象陪伴感瞬间碾压一百句干瘪问候！", "humorous_reply": "刚路过一家巨香的烤肉店，一个人在门口纠结了三秒，突然觉得这会儿身边缺个战斗力强的饭搭子，你吃晚饭没？", "keywords": ["主动找她", "吃了吗", "早安", "没话题开场", "日常分享", "拍照"], "stage": "升温期", "subtext": "干巴巴的问候是在向她索取话题，而随手分享一个带烟火气的生活画面并轻轻cue到她，是零压力提供分享欲，最容易擦出小暧昧。", "trigger": "想主动找女生聊天，又怕干问“吃了吗/早安”太无聊，怎么自然开场？", "warm_reply": "今天下班路上撞见一片特别好看的晚霞，随手拍了一张发给你，希望也能把今天的好心情分你一半～", "category": "初识破冰", "ch_num": 2, "id": "S057"}, {"bad_reply": "“好久不见呀，最近太忙了没顾上找你，你还记得我吗？”——生硬客套又显得小心翼翼，瞬间提醒对方“咱俩其实很不熟”。", "confident_reply": "终于把前阵子手头的大忙季熬过去了，赶紧出来透透气。你最近忙啥呢，有没有发现什么好玩好吃的新地方？", "followup_tip": "看她接话的温度：只要她笑着回“哪有忘，你叫XX”，说明对你完全没芥蒂，直接开启新近况闲聊，绝不翻旧账纠结之前为啥没联系。", "humorous_reply": "我打赌你都快忘我叫啥了哈哈，赶紧出来冒个泡刷新一下存在感，免得下次路上偶遇你只能喊我“哎那个谁”～", "keywords": ["断联", "好久没聊", "重启聊天", "复联", "冷淡期", "怎么开口"], "stage": "初识期", "subtext": "断联后双方都有点怕突兀，千万别卑微道歉解释为什么没找她，用轻度激将自嘲或新鲜生活由头切入，一秒化解陌生感。", "trigger": "前阵子加了微信聊过几句，后来忙断联了好几天/几周，怎么自然重启对话？", "warm_reply": "前阵子忙得脚不沾地，刚刷到个跟之前咱俩聊过的话题特别像的东西，一下就想起你来了，最近过得怎么样呀？", "category": "初识破冰", "ch_num": 2, "id": "S058"}, {"bad_reply": "“怎么会聊不来呢？我每天都找你聊天，哪里做得不好我改还不行吗？”——急着反驳抬杠或卑微讨好，等于逼她立刻给你下淘汰通知。", "confident_reply": "隔着手机谈感情迟早会把话聊完的，见都没见过几次就把话题耗光多可惜。不如这周末约顿饭见一面，当面聊十分钟比微信打一千字都管用，敢不敢试试？", "followup_tip": "“聊天饱和态”急救三步SOP：先认同不辩解 → 点破是纯网聊形式耗光新鲜感而非人不合拍 → 顺势转化成线下见面邀约。", "humorous_reply": "说实话我也有点同感，天天隔着冷冰冰的手机屏幕打卡，神仙也把新鲜感聊光了哈哈。所以你是正式通知我断联，还是想探讨下怎么换个舒服的方式处？", "keywords": ["聊不来", "不合适", "没话说", "聊天饱和", "冷淡", "挽回"], "stage": "升温期", "subtext": "真想彻底放弃你的人根本懒得说这句！她说“感觉聊不来”往往是因为长期只网聊不见面进入“聊天饱和态”，是在给你改变现状的窗口。", "trigger": "网聊一阵子沦为打卡，女生突然说：“感觉我们好像不太聊得来”", "warm_reply": "其实不是咱们人不合拍，刚认识那会儿咱俩明明挺投缘的，主要是最近碎片化网聊太频繁把话题聊干了。一直隔着屏幕确实容易有错觉。", "category": "初识破冰", "ch_num": 2, "id": "S059"}, {"bad_reply": "“太晚了快睡吧晚安，明天我再找你聊哦！”——等彻底没话说了才干巴巴道晚安，毫无未完成悬念感。", "confident_reply": "跟你聊天确实挺有意思的，不过我这会儿刚好有点事要去忙一下，咱们留点话题下次再聊，先去忙啦～", "followup_tip": "发完这句等她回“好哒去忙吧”后，点个表情回应或直接停住，千万别又没完没了聊半小时！把这份余温留到下次开场或线下邀约。", "humorous_reply": "不行了，跟你聊天太容易上头超时了哈哈，我得赶紧去把手头剩的一点正事收个尾，先欠着，回头空了继续接着刚才那个梗聊！", "keywords": ["收尾", "结束聊天", "晚安", "意犹未尽", "聊嗨了", "高点抽离"], "stage": "升温期", "subtext": "直男总喜欢把天一直聊到双方困得没话说才散场；在情绪最高点礼貌主动抽离（蔡格尼克效应），才会让她放下手机后忍不住回味你。", "trigger": "跟女生正聊在兴头上，怎么在气氛高点体面收尾，让她对你意犹未尽？", "warm_reply": "今天跟你聊得真的挺开心的，感觉时间一下就过去了。不过看点儿不早了，不能耽误你明天早起精神，今晚先聊到这儿，做个好梦呀～", "category": "初识破冰", "ch_num": 2, "id": "S060"}, {"bad_reply": "“你什么时候有空呀？我想请你出来吃个饭认识一下可以吗？”——开放式卑微请示，对方本能回一句“最近比较忙改天吧”直接卡死。", "confident_reply": "隔着屏幕聊不如当面认识一下，这周末我想去尝尝收藏夹里那家口碑很棒的店，周六晚还是周日晚你有空？我提前把位置订好。", "followup_tip": "遵守“先定时间再定细节、见好就收”原则：一旦她答应周六或周日，确认好她不忌口后，立刻大方收尾“行，那我先去忙工作，周五发你具体位置”，切忌急约当晚！", "hu 时回头喘口气，我一直在后面给你托底。", "category": "关心安慰", "ch_num": 5, "id": "S125"}, {"bad_reply": "“怎么天天加班啊，你们公司也太坑了吧，快点弄完回家吧。”——干巴巴吐槽她公司只会放大烦躁，催她“快点弄完”更是站着说话不腰疼。", "confident_reply": "把公司定位发我，看你这架势晚饭肯定又糊弄了。我去楼下给你带份热乎的夜宵，明天我也有早会不耽误你太久，看你拿上我就走。", "followup_tip": "主动说明“明天我有早会，看你拿上我就走”是顶级分寸感技巧——能瞬间打消她“太晚见面有压力、加班憔悴不好看”的防备心理，用克制和靠谱感大幅拉升信任度。", "humorous_reply": "刚替你朝你们公司方向隔空瞪了一眼老板。你先专心收尾不用分心回我，等你忙完出来，本专车司机兼出气筒随时待命。", "keywords": ["加班", "熬夜加班", "还没下班", "忙工作", "掏空"], "stage": "约会期", "subtext": "孤零零留在办公室最容易产生委屈和孤独感，她需要一种“有人在惦记我、等我下班”的踏实陪伴，但又不能给她增加回复负担。", "trigger": "女生晚上八九点发消息：“还在公司加班改东西，感觉身体被掏空了……”", "warm_reply": "这么晚还在扛，真是辛苦我们大忙人了。你先安心把收尾弄完，不用急着回我消息，下班上车了给我发个表情包就行，我陪你一路聊回家。", "category": "关心安慰", "ch_num": 5, "id": "S126"}, {"bad_reply": "“怎么了？发生什么事了？谁惹你了快跟我说说！”——连环追问就像审讯，逼她把不想提的糟心事再反刍一遍，瞬间让她后悔找你。", "confident_reply": "人在屋里闷着越想越烦，别自己憋着了。半小时后换双舒服的鞋下楼，带你去江边吹吹晚风买杯热饮，全程不用你找话题，听歌发呆都随你。", "followup_tip": "如果她此刻确实不想出门，千万别强拉，温和回一句“好，那我给你点块小甜品放门口，吃点甜的多巴胺会救场”，给足空间反而会让她缓过来后主动找你倾诉。", "humorous_reply": "收到，今天特批你当一天不营业的小哑巴。你只管窝着放空，需要骂人我代劳，需要逗乐我讲冷笑话，听烦了发个句号我就静音。", "keywords": ["心情不好", "心情差", "不开心", "低落", "emo", "不想说话"], "stage": "升温期", "subtext": "嘴上说“不想说话”却专门发消息告诉你，说明她不想应付盘问，只想找个安全的角落被无条件接纳和陪伴。", "trigger": "女生突然发：“今天心情好差，干什么都提不起劲，不想说话”", "warm_reply": "不想说就不说，原因没那么重要。平时看你对谁都笑呵呵的挺好相处，其实很多情绪都习惯自己咽下去吧，在我这儿不用硬挤笑脸，我就安安静静陪你待会儿。", "category": "关心安慰", "ch_num": 5, "id": "S127"}, {"bad_reply": "直接甩个小红包过去说“别哭啦，拿去买点好吃的！”——脆弱倾诉时粗暴拿红包打发，不仅化解不了委屈，还会把关心变成廉价交易，显得你敷衍不走心。", "confident_reply": "先把纸巾拿好擦擦脸，去倒杯温水喝两口缓一下。要是不嫌弃我现在声音有点低，打个语音给你？你不用说话，听我陪你待会儿就好。", "followup_tip": "若接通语音，语速一定要放慢、声音放轻，少讲道理多倾听；等她情绪平复带点鼻音笑出来时，轻声补一句“好了，今晚的眼泪归我保管，睡醒就翻篇了”，宿命感直接拉满。", "humorous_reply": "谁把我们平时天不怕地不怕的小朋友惹哭了？眼泪先擦擦，再哭明天眼睛肿成小核桃可就要赖我没哄好了，来，耳朵借你倒苦水。", "keywords": ["哭了", "想哭", "委屈", "破防", "难过", "崩溃"], "stage": "暧昧期", "subtext": "这是女性心理防线最薄弱的“吊桥窗口期”，把眼泪暴露给你是极高信任信号，她渴望被看穿坚强外壳下的脆弱并获得偏爱保护。", "trigger": "女生深夜破防发消息：“突然觉得好委屈，刚刚没忍住偷偷哭了一鼻子”", "warm_reply": "能把哭鼻子这件事告诉我，说明没拿我当外人。我知道你平时在外面一直挺独立的，什么都习惯自己扛，但在我面前真不用一直装大人，想哭就痛快哭出来，我在呢。", "category": "关心安慰", "ch_num": 5, "id": "S128"}, {"bad_reply": "“别瞎想，你最棒了，加油相信自己！”——跟群发鸡汤毫无区别的空洞口号，因为没有任何具体依据，听在她耳朵里只会觉得你在走过场哄小孩。", "confident_reply": "人累的时候脑子本来就会转不动，这时候复盘全是负能量。听我的，现在立刻停下别想了，先把肚子填饱睡一觉，天塌下来明天我陪你一起捋。", "followup_tip": "发完后可以顺口提一件她之前做得很出色的具体小事（如审美在线、做事细心），“具体细节认可”比一万句空洞的“你好棒”更能击穿她的焦虑防线。", "humorous_reply": "不许当着我的面抹黑我看上的人啊，你要是都算笨，那我平时对你的佩服岂不是显得我很没眼光？今天只是一次小失误，驳回你的自我批评。", "keywords": ["自己好笨", "做不好", "自我怀疑", "很差劲", "自卑", "焦虑"], "stage": "升温期", "subtext": "一时的挫败引发了全盘自我否定，她不需要廉价的加油口号，而是需要你用具体视角帮她找回自我价值感与被肯定感。", "trigger": "女生陷入自我怀疑：“我觉得自己好笨啊，怎么什么事都做不好……”", "warm_reply": "你不是做不好，你只是对自己要求太高了。换作是我扛你手头这些事，估计早就手忙脚乱了，你每次认真较劲的样子其实特别耀眼，别因为一件小事否定自己。", "category": "关心安慰", "ch_num": 5, "id": "S129"}, {"bad_reply": "“出门前怎么不看天气预报啊，拿外卖也太不小心了吧。”——典型马后炮式指责，她本来就够惨了还要听你挑刺，好感度直接清零。", "confident_reply": "先把湿衣服换下来把头发吹干，小心着凉。正好把坏运气都留在今天，周末请你吃顿好的去去晦气，甜品还是火锅你来定。", "followup_tip": "初识期不便直接索要家庭住址送外卖（容易引发隐私防备），可以点一张热奶茶的电子礼品卡发给她，既体面无压力又显得极其细心周到。", "humorous_reply": "恭喜你啊，这说明你这个月的水逆额度今天一次性集中扣完了，从今晚八点开始，接下来整整一个月全是好运反弹期！快去洗个热水澡接好运。", "keywords": ["水逆", "倒霉", "淋雨", "诸事不顺", "抓狂", "烦死了"], "stage": "初识期", "subtext": "接二连三的小倒霉让她急需一个情绪出口吐槽泄愤，只要能把这股闷气逗笑化解，就能瞬间拉近初识的距离感。", "trigger": "女生抓狂吐槽：“今天真的水逆到家了！出门忘带伞淋雨，拿外卖还洒了一身！”", "warm_reply": "抱抱，今天老天爷这是故意给你出难题呢。淋了雨最容易感冒，赶紧先去冲个热水澡换身干爽衣服，洒掉的那顿不算数，想吃什么我给你补一份热乎的。", "category": "关心安慰", "ch_num": 5, "id": "S130"}, {"bad_reply": "“你终于找我啦！我也好无聊，你想聊点啥？”——一秒暴露卑微需求感，还把找话题的担子甩回给她，瞬间让她失去兴致退回普通朋友区。", "confident_reply": "无聊的话正好帮我参谋个严肃问题：城西新开的那家烤肉和江边那家日料哪个更值得去？选出来了今晚请你去实地考察，顺便跟你说个秘密。", "followup_tip": "若她对幽默版嘴硬反驳“少自恋了才没有”，千万别较真，顺势以退为进：“好吧是我自作多情了，本来还想晚上请你吃饭时跟你说个秘密呢”，用好奇心钩子引她主动赴约。", "humorous_reply": "我刚翻了一下中西方语言词典，上面说西方人比较直接，一般说“我想你了”；东方人比较含蓄，通常都说“好无聊啊”。", "keywords": ["好无聊", "无聊", "没事干", "发呆", "闷得慌", "找话题"], "stage": "暧昧期", "subtext": "女生绝不会对没好感的人喊无聊，这是标准的“含蓄版我想找你玩”，她在等一个有趣的话头或顺理成章的邀约台阶。", "trigger": "女生百无聊赖地发来一句：“好无聊啊，在家发呆一整天了”", "warm_reply": "巧了，我刚忙完手头的事正想找你呢，结果你就心灵感应发过来了。今天怎么没出去逛逛，是在家攒电量等我找你玩吗？", "category": "关心安慰", "ch_num": 5, "id": "S131"}, {"bad_reply": "“多喝点红糖热水，吃片布洛芬捂着肚子睡一觉吧。 }, {"bad_reply": "“最近换季流感很厉害，你多喝点胖大海泡水，少说话多休息。”——老中医式养生科普，看完除了客气回个“嗯嗯谢谢”毫无下文。", "confident_reply": "给你点了润喉含片和热炖雪梨，一会到了记得润润嗓子。这两天禁止吃辣吃炸鸡啊，等嗓子彻底好了，我亲自带你去把馋的那些统统补回来。", "followup_tip": "践行“静音陪伴法”：接下来可以发一两张路上拍到的可爱小猫或晚霞照片给她，补一句“不用打字回，看一眼开心一下就行”，这种零负担的细腻温柔最让女生上头。", "humorous_reply": "那从现在开始开启“静音VIP模式”，今天换我单方面碎碎念给你听，你只需要发表情包点头或者摇头批阅就行，绝对不费半点嗓子。", "keywords": ["嗓子疼", "吞刀片", "咳嗽", "鼻塞", "扁桃体发炎", "说不出话"], "stage": "升温期", "subtext": "身体不适导致表达精力下降，她既想跟你保持联系，又怕自己病恹恹没法好好打字接话。", "trigger": "女生发文字说：“嗓子疼得像吞刀片，感冒鼻塞连话都说不出来了”", "warm_reply": "吞刀片那个罪太磨人了，这几天先委屈我们小话匣子歇一歇。手边有润喉糖和温水吗？不用勉强打字回我，知道你在我就很安心了。", "category": "关心安慰", "ch_num": 5, "id": "S135"}, {"bad_reply": "“怎么这么马虎啊，走路玩手机了吧？涂点红花油揉揉就行，小伤没事的。”——先怪她马虎、再轻描淡写说“小伤没事”，还给出了“揉揉”的错误急救建议，直接浇灭撒娇欲。", "confident_reply": "千万先别使劲揉！扭伤头二十四小时得冰敷消肿。家里医药箱有冰袋和喷雾吗？没有的话我现在买药给你闪送过去，这几天老实歇着，有跑腿的活随时支使我。", "followup_tip": "若是做饭划破手，果断版可改为提醒“先用碘伏消毒贴透气创可贴，这两天洗碗碰水的活别干了”；先共情心疼再给一句靠谱处理常识，第二天记得追问“今天消肿一点没”形成闭环。", "humorous_reply": "怎么回事，这路这么不长眼，居然敢欺负到咱们头上了？快让我隔空吹两口气止止疼，看来以后没我在旁边盯着还真让人不放心。", "keywords": ["扭到脚", "崴脚", "受伤", "划破手", "磕到了", "好疼"], "stage": "暧昧期", "subtext": "日常小意外带来的疼痛会瞬间激起女生的委屈和撒娇心理，发给你看就是在求“呼呼”和偏爱心疼，别当成普通擦伤冷漠处理。", "trigger": "女生发消息或拍照片说：“刚下楼没看路，不小心扭到脚踝了，好疼呜呜”", "warm_reply": "哎呀看着都替你疼，怎么这么不小心呀……先别乱动了，找个地方坐下来缓口气看看肿没肿。平时看你风风火火的，其实还是个需要人操心照顾的小迷糊。", "category": "关心安慰", "ch_num": 5, "id": "S136"}, {"bad_reply": "“怎么头疼了？要不要我现在买药送到你家楼下？快把地址发我！”——刚认识就急着往人家家里跑、索要私人住址，暴露极强压迫感与低边界感，吓得女生不敢再聊。", "confident_reply": "好，身体要紧，赶紧去休息吧。明天早上起来要是还难受别硬撑，慢点开启一天，晚安。", "followup_tip": "说完晚安后立刻干脆停手，绝不要再多发消息震她手机；等第二天中午饭点（避开早高峰忙乱），自然轻松问一句“今天头还疼吗？满血复活没”，顺滑重启聊天。", "humorous_reply": "收到，肯定是今天动脑子太多超负荷运转了。快把手机丢远点关灯睡觉，剩下的话题我先帮你存着，等你满血复活了咱们再接着聊。", "keywords": ["头疼", "先睡了", "刚认识不舒服", "相亲关心", "早点睡"], "stage": "初识期", "subtext": "初识阶段关系尚浅，她可能是真的头疼想休息，也可能是社交电量耗尽礼貌收尾；此时最忌用力过猛越界送药，克制得体的关心最加分。", "trigger": "刚加微信不久的女生说：“今天头有点疼，不太舒服，我先睡啦”", "warm_reply": "头疼最磨人了，把房间灯光调暗一点好好睡一觉吧。手机调静音不用回我啦，祝今晚做个好梦，醒来就不疼了。", "category": "关心安慰", "ch_num": 5, "id": "S137"}, {"bad_reply": "“老板为什么批你呀？是不是哪个数据确实没做好？职场嘛习惯 140"}, {"bad_reply": "“别看手机了，把眼睛闭上什么都别想，数羊一会儿就睡着了。”——失眠的人最烦听“闭眼就能睡着”，无聊又生硬，白白浪费深夜升温黄金期。", "confident_reply": "把房间灯关了，手机屏幕调最暗放枕头边。要不要给你拨个语音？你闭着眼睛不用说话，我放慢语速给你讲个超无聊的小故事，保准十分钟困意就上来了。", "followup_tip": "深夜陪聊记住“绝不抛费脑子的问题”，节奏放轻缓；一旦她回复变慢或没回，千万别追问“睡着了吗？”把她吵醒，留一句“好梦，我睡啦”让她次日醒来看到满心悸动。", "humorous_reply": "是不是白天偷懒睡多啦，还是脑子里有个人占着内存没清理干净？把被子盖好别乱踢，不然一会梦里巡逻抓到你着凉可要扣分的。", "keywords": ["失眠", "睡不着", "熬夜", "半夜", "数羊", "哄睡"], "stage": "暧昧期", "subtext": "夜深人静荷尔蒙最感性，睡不着找你代表你在她深夜置顶名单里，此时一点暧昧推拉或低压力哄睡，抵得上白天聊十句。", "trigger": "凌晨一两点，女生发消息：“翻来覆去怎么都睡不着，越躺越精神好烦呀”", "warm_reply": "睡不着就别硬逼自己睡了，越着急越清醒。正好我也还没困，陪你安安静静聊五块钱闲天，什么时候眼皮打架了直接把手机一丢睡就行，不用特意跟我说晚安。", "category": "关心安慰", "ch_num": 5, "id": "S141"}, {"bad_reply": "“梦都是假的，别自己吓自己了，快接着睡吧明天还要早起呢。”——用冰冷的唯物主义否定她的恐惧感，显得极其冷漠扫兴。", "confident_reply": "别闭眼硬想刚才的画面了，开盏小灯看看熟悉的房间。要是不敢一个人待着，我现在给你打语音挂着，听到有人呼吸说话你就安心了，来。", "followup_tip": "若是早上醒来才看到她半夜发的这条消息，千万别轻描淡写略过，第一时间回：“刚醒看到消息好心疼，后半夜睡踏实了吗？坏梦都被我没收了，醒了给我报个平安”。", "humorous_reply": "别怕别怕，本守夜大队长刚好在线巡逻呢！梦都是反的，而且凶神恶煞看到我护着你都得绕道走，快把被子裹紧留个小呼吸孔就行。", "keywords": ["做噩梦", "噩梦", "吓醒", "害怕", "不敢睡", "半夜惊醒"], "stage": "升温期", "subtext": "惊醒后的几分钟是极度缺乏安全感的时刻，她本能抓起手机找最能给她保护感的人，你的及时回应就是最强定心丸。", "trigger": "半夜女生突然发来消息：“刚做了个超级吓人的噩梦，吓醒了心还在狂跳，不敢睡……”", "warm_reply": "摸摸头不害怕啊，醒过来就安全了，我在呢。先把床头小夜灯打开，喝口温水压压惊，我先不睡，就在这儿守着你，等你睡踏实了我再睡。", "category": "关心安慰", "ch_num": 5, "id": "S142"}, {"bad_reply": "“没睡呢，躺床上刷短视频呢，你呢？”或急吼吼回“我正好在想你！”——前者老实报流水账毫无火花，后者人家一个平A试探就把你底牌大招全骗出来了。", "confident_reply": "还没睡，刚听着歌放空一会儿。这么晚还没休息，是有心事睡不着，还是单纯想找个人陪你聊聊天？正好我今晚接下来的时间归你。", "followup_tip": "“刚洗完澡头发没擦干就回你”既传递了迫不及待秒回的重视感，又自然带出干净清爽的画面留白，但点到为止绝不低俗擦边，等她接话后立刻切入轻松话题（踩油门后及时踩刹车）。", "humorous_reply": "刚洗完澡头发还没擦干呢，听到手机响以为有重要军情就赶紧抓起来看了。这么晚突击查岗，是不是白天忘了想我，晚上来补作业了？", "keywords": ["在干嘛", "睡了吗", "深夜找我", "查岗", "夜聊", "想你"], "stage": "暧昧期", "subtext": "深夜主动问“在干嘛”九成是孤单想你了在释放试探窗口，避开枯燥行程汇报，用生活画面感留白最能撩拨心弦。", "trigger": "深夜十一点多，女生主动发来试探：“睡了吗？你在干嘛呢？”", "warm_reply": "刚忙完手头一点事准备躺下，正犹豫这么晚找你会不会吵到你睡觉呢，结果你就发消息过来了，看来咱俩今晚挺有默契。今天过得怎么样？", "category": "关心安慰", "ch_num": 5, "id": "S143"}, {"bad_reply": "“没事没事 句：过去这一年最棒的彩蛋就是认识你，新的一年，愿你有趣有盼，也希望我能一直在你身边。", "category": "关心安慰", "ch_num": 5, "id": "S149"}, {"bad_reply": "直接转发一段带生肖押韵的群发顺口溜或拜年大红表情包——敷衍感拉满，等于直接告诉她“你在我通讯录里只是凑数的普通人”。", "confident_reply": "过年好！专门挑了个不挤的时间给你单独拜个年。在家好好陪爸妈吃顿团圆饭，等过完年回来，开工第一杯奶茶和第一顿大餐我都给你留着呢。", "followup_tip": "除夕夜随手拍一张你老家的烟花或年夜饭一角发过去，自然引导她也拍一张家里的特色菜（开启春节异地分享欲），轻松避开过年长假断联降温坑。", "humorous_reply": "除夕快乐呀！刚吃完年夜饭出来透透气，顺便问问某位小朋友今年压岁钱收够了没？要是家里七大姑八大姨开始催婚盘问了随时喊我，本专业挡箭牌春节不打烊。", "keywords": ["除夕", "春节", "拜年", "过年好", "年夜饭", "大年初一"], "stage": "升温期", "subtext": "春节假期异地分开、家里长辈喧闹，一条带着年味烟火气和单独惦记的私聊祝福，最能勾起假期“想见你”的思念。", "trigger": "除夕夜或春节拜年，想避开俗套吉祥话，给喜欢的女生发一条走心又有烟火气的专属祝福", "warm_reply": "除夕快乐！刚抬头看窗外放烟花，万家灯火热热闹闹的，突然就很想知道你今晚年夜饭吃了什么好菜。新的一年不祝你大富大贵了，只愿你岁岁常欢愉，万事皆顺意。", "category": "关心安慰", "ch_num": 5, "id": "S150"}, {"bad_reply": "装作无事发生一整天不吭声，或者突然线上长篇大论逼问“今天七夕，做我女朋友好不好？”——前者木讷错失良机，后者线上盲目逼宫极易惨遭好人卡。", "confident_reply": "虽然现在还不是名正言顺的男朋友，不能太高调，但别人家小朋友今天有的花和好心情，我也想给你备一份。晚上七点有空吗？带你去过个没有压力的半糖节日。", "followup_tip": "如果她答应晚上出来见面，窗户纸基本已破九成！提前备一束小巧有审美的花束（如碎冰蓝或郁金香，切忌99朵红玫瑰太隆重施压），饭后并肩散步时自然牵手升级关系。", "humorous_reply": "今天打开朋友圈全在秀恩爱，本来想保持高冷装没看见，想想还是没忍住跑来问一句：今天这个节，以咱俩目前的交情，能不能申请擦个边一起过一下？", "keywords": ["七夕", "情人节", "520", "暧昧过节", "不敢表白", "浪漫节日"], "stage": "暧昧期", "subtext": "暧昧期过浪漫节是最微妙的博弈：装死不发会被扣分觉得没心意，猛烈表白又怕压力太大吓退她，“半糖推拉试探”刚刚好。", "trigger": "情人节、520或七夕到了，还在暧昧期没捅破窗户纸，怎么发祝福既撩人又不吓跑她？", "warm_reply": "今天街上到处都是捧着花的人，路过花店的时候脑子里第一个蹦出来的人就是你。虽然咱们还没给关系贴标签，但今天这份开心的仪式感，我不想让你缺席。", "category": "关心安慰", "ch_num": 5, "id": "S151"}, {"bad_reply": "只干巴巴转个520红包配文“节日快乐老婆，爱你么么哒”——只有转账没有走心表达，像完成年度打卡任务，女生收了钱心里也觉得被敷衍。", "confident_reply": "认识你之前我其实没那么期待长远的以后，是你让我有了想把柴米油盐过好的踏实感。礼物和餐厅都安排妥了，未来的每一个纪念日，我都想稳稳当当地陪在你身边。", "followup_tip": "把这段话手写在礼物附赠的小贺卡上（哪怕字迹普通也比纯微信文字珍贵十倍），并在末尾加一句感谢她最近为你做过的某件具体小事，正向肯定会让她越来越爱你。", "humorous_reply": "节日快乐，我的长期合伙人！自我检讨一下，本人平时嘴笨偶尔还直男思维，全靠你大人有大量一直懂我包容我。以后吵架我先低头，好吃的你先动筷，请继续多指教啦。", "keywords": ["纪念日", "女友过节", "表白文案", "偏爱金句", "小作文", "周年庆"], "stage": "相处期", "subtext": "进入稳定恋爱期后，女生最怕你把她的好当成理所当然；结合日常烟火气的“唯一偏爱与具体肯定”最能让她瞬间眼眶发热。", "trigger": "情人节、七夕或恋爱纪念日，嘴笨  "stage": "相处期", "subtext": "因为理亏心虚，故意用“敷衍认错+提分手掀桌”来转移焦点，赌你害怕失去她而反过来哄她，借此逃避责任并摸清你的底线。", "trigger": "明明是她理亏（如无故失联、越界或乱发火），你刚提一句她就倒打一耙：“行行行都是我的错行了吧！我脾气就这样，受不了就分！”", "warm_reply": "我跟你聊这件事，是因为珍惜这段感情想把疙瘩解开，不是为了逼你赌气说狠话。要是每次遇到问题都拿分开压我，再热的心也会凉的，你先冷静想想吧", "category": "冷淡破局", "ch_num": 7, "id": "S213"}, {"bad_reply": "“宝贝我真的知道错了，没有你我活不下去，求你再给我最后一次机会我发誓全改！” —— 索取式哀求只会坐实你毫无长进，逼她彻底拉黑清净。", "confident_reply": "放心，发这条不是来纠缠求复合的。这段时间我想明白了自己过去在沟通上有多敷衍，感谢你陪我成长这一程。之前落我这儿的小东西我寄回给你还是放老地方？", "followup_tip": "核心策略“先声明尊重决定卸下防备 + 精准点出过去病根展现蜕变 + 留低门槛客观钩子”。她一旦回复，保持克制简短互动，切忌刚回两句就急着求复合！", "humorous_reply": "刚整理东西翻到你之前推荐给我的那家胃药，突然意识到以前光顾着嘴硬，都没好好听懂你的委屈。不纠缠你，就是想跟你说声谢谢，记得按时吃饭", "keywords": ["提分手", "失望型分手", "挽回", "断联复联", "攒够失望", "破冰"], "stage": "相处期", "subtext": "没拉黑全网说明心里还有余温与不甘，但她对你的“空口发誓”已经彻底免疫，极度戒备你死缠烂打逼她复合。", "trigger": "以前吵架总靠嘴上哄过去没改掉问题，这次女生攒够失望提分手（但没删微信），冷静几天后怎么发第一条破冰消息？", "warm_reply": "这几天冷静下来复盘了一下，以前每次闹矛盾我只顾着哄当下的情绪，却没真正解决让你心累的问题。你决定分开我尊重你，不逼你回头，只希望你这几天睡得好一点", "category": "冷淡破局", "ch_num": 7, "id": "S214"}, {"bad_reply": "“你好，我是王姨介绍的，今年29岁做IT有房有车，你平时喜欢干嘛？” —— 像房产中介群发简历外加查户口审讯，女生瞬间丧失聊天欲，只想回个礼貌表情包结束对话。", "confident_reply": "哈喽你好呀，相亲这种形式虽然有点正式，但就当多认识个同城新朋友，不用有压力，平时怎么称呼你比较顺口？", "followup_tip": "等她回称呼后别急着连环提问，顺手看一眼她朋友圈最新动态（美食、宠物或旅行）切入聊两三句，先聊出生活松弛感，再自然互换基本情况。", "humorous_reply": "刚还在想怎么跟介绍人嘴里夸了半天的姑娘打招呼才不显老套，纠结两分钟还是决定实话实说哈哈，很高兴认识你呀~", "keywords": ["加微信", "第一句", "开场白", "破冰", "介绍人", "刚加上"], "stage": "初识期", "subtext": "刚加上陌生相亲对象时她同样带着防备和敷衍心理，此刻不需要你背诵户口本简历，而是看你顺不顺眼、聊起来有没有松弛感。", "trigger": "介绍人刚推了相亲女生微信，通过好友后怎么发第一句话（避免干发“你好”或查户口）？", "warm_reply": "你好呀，刚通过好友~ 听介绍人说你平时工作挺充实的，今天这会儿忙完下班了吗？", "category": "相亲谈婚", "ch_num": 8, "id": "S215"}, {"bad_reply": "“你怎么一直看手机不说话呀？是不是对我不太满意？” —— 一上来就敏感索要评价，把低姿态和焦虑全盘暴露，场面只会更窒息。", "confident_reply": "我觉得相亲就是给平时忙工作的两个人搭个认识的桥，又不是组织直接分配对象哈哈，咱们今天怎么放松怎么聊，你平时喝咖啡偏美式还是拿铁？", "followup_tip": "点完单后遵循“先讲一两点自己、再顺手抛个小话题”的对等节奏，控制在40～60分钟喝完咖啡意犹未尽时主动收场，切忌初见硬撑三小时把话聊干。", "humorous_reply": "说实话每次这么面对面坐着像面试一样，我都替咱俩紧张哈哈，咱们今天就当周末出来偷懒喝杯东西，不背标准答案好不好？", "keywords": ["第一次见面", "冷场", "尴尬", "面对面", "初见", "没话聊"], "stage": "相亲局", "subtext": "相亲初见天然带着“被审视”的紧绷感，她看手机多半是在掩饰局促，需要你用细节体贴和自嘲卸下正式感。", "trigger": "相亲第一次线下见面刚坐下，女生有点拘谨低头看手机，怎么自然开口破除尴尬？", "warm_reply": "今天外头有点凉，刚先让店员给你倒了杯温水暖暖手。路上过来堵车吗？先歇口气不用急着找话题。", "category": "相亲谈婚", "ch_num": 8, "id": "S216"}, {"bad_reply": "秒点收款回“行，谢谢”，或生硬拒绝“大老爷们哪能让女生掏钱” —— 秒收直接把关系A成路人；硬撑说教又会让独立女生觉得欠人情有负担。", "confident_reply": "转账我就不点啦，相亲第一面男士买单是基本礼数。你要是实在过意不去，下周挑家你喜欢的甜品店请我吃个下午茶扯平？", "followup_tip": "重点看她怎么接：如果笑着答应“那下次我请你”说明有戏，隔两天顺势约二见；如果坚持退回甚至发红包逼你必须收下，说明没看上不想欠人情，体面收下及时止损即可。", "humorous_reply": "这转账我要是点了，显得我多没诚意请新朋友吃饭呀哈哈。先存你那儿，下次你带我去喝你常去的那家咖啡当回请就行~", "keywords": ["买单", "AA", "转账", "退钱", "请客", "饭钱"], "stage": "相亲局", "subtext": "她主动转AA钱有两种可能：一是家教好不想初见欠人情，二是没眼缘想两不相欠。用“不收钱换下次邀约”一试便知真假。", "trigger": "相亲吃完第一顿饭你买完单，女生微信转来一半饭钱说：“今天谢谢款待，这顿我们AA吧”", "warm_reply": "今天跟你聊天挺投缘的，第一顿饭理应我做东，心意我领啦，钱就不收了，能认识个聊得来的朋友比顿饭值多了。", "category": "相亲谈婚", "ch_num": 8, "id": "S217"}, {"bad_reply": "“周末有空吗？我请你吃饭看电影逛街吧” —— 传统老三样毫无记忆点，看电影摸黑两小时零交流，逛街遇到贵重专柜买不买单更是两难陷阱。", "confident_reply": "干坐着吃饭看电影太没新意了，周六下午三点我带你去个好玩的地方体验一下室内攀岩和蹦床，出点汗特别解压，你穿双舒服的运动鞋就行。", "followup_tip": "选高互动场所（射箭、手作、紧凑清吧或游乐园）能自然拉近肢体距离；在她专注瞄准或做手工时，递瓶温水顺口夸一句“你刚才认真的样子特别好看”，升温极快。", "humorous_reply": "发现一家超解压的室内射箭馆，周末带你去试试手气？输的人请喝隔壁手打柠檬茶，提前声明我也是半吊子，绝不欺负新手哈哈~", "keywords": ["第二次约会", "二见", "约出来", "去哪玩", "看电影", "约会地点"], "stage": "约会期", "subtext": "二见愿意见面说明对你有基础好感，但干坐吃饭易冷场、看电影没法互动，她更期待有新鲜体验感且不尴尬的协作约会。", "trigger": "相亲见完第一面印象不错，想约周末第二次见面升温，怎么避开“吃饭看电影”无聊老三样？", "warm_reply": "看你这周连轴转挺累的，周末不想排太满折腾你。城西有家藏在巷子里的安静小馆，吃完还能去旁边陶艺店捏个小杯子放空一下，周六下午去坐坐？", "category": "相亲谈婚", "ch_num": 8, "id": "S218"}, {"bad_reply": "“没关系的，我可以一直等你，先做普通朋友慢慢了解也挺好” —— 主动签下备胎卖身契，耗时几个月当免费司机饭票，最后看她和别人闪婚。", "confident_reply": "坦白讲我身边朋友已经够多了，出来相亲就是奔着认真恋爱结婚去的，成年人不搞无效社交。觉得有眼缘咱们就按处对象的方向接触，没感觉直说也没事，不耽误彼此。", "followup_tip": "亮明底线框架后立刻停止单向嘘寒问暖，晾她两三天：如果她心里有你只是矜持试探，感受到失去感会主动找话题靠近；如果顺坡下驴冷淡，恭喜你及时省下几个月沉没成本。", "humorous_reply": "哈哈我身边铁哥们和普通朋友早就满员超编啦，再招普通朋友档期可排不过来了，我这儿目前只招“准对象实习生”这一个岗位~", "keywords": ["慢热", "当朋友", "普通朋友", "拒绝", "发好人卡", "备胎"], "stage": "相亲局", "subtext": "相亲局里的“慢热、先当朋友”九成是委婉发卡或把你放进备胎池骑驴找马，乖乖顺从只会沦为长期买单工具人。", "trigger": "相亲接触两周想推进一点，女生却发：“我这个人比较慢热，咱们还是先从普通朋友做起吧”", "warm_reply": "我理解女孩子面对感情需要时间确认安全感，不用赶进度；不过我对你有好感也是认真的，就像绿灯留给想过马路的人才有意义，你慢慢感受，别让我等太久就好。", "category": "相亲谈婚", "ch_num": 8, "id": "S219"}, {"bad_reply": "“好吧没关系，那你先忙，哪天有空了随时叫我！” —— 毫无底线的卑微顺从只会让对方觉得你的时间一文不值，下次照样心安理得放你鸽子。", "confident_reply": "了解你有重要的事要忙，不过我今天特意把别的应酬推掉留出时间，突然取消确实让我觉得不太受尊重。其实也怪我把这次见面看太重了，你先忙你的吧。", "followup_tip": "发完这句直接断联去过好自己的周末，绝不追问。男人最硬的底牌是自尊：真正在意你的女生会产生愧疚感并主动提出具体补约补偿，毫无表示的直接淘汰。", "humorous_reply": "收到，刚打理好的发型只能独自去吹吹风啦。看来今天咱俩缘分欠费，先记你一笔账，看你后续诚意再决定给不给补考机会~", "keywords": ["放鸽子", "爽约", "临时有事", "改天", "取消约会", "立规矩"], "stage": "约会期", "subtext": "除非突发急事并主动敲定改期时间，否则临门一脚敷衍“改天”就是在轻视你的时间成本，测试你是不是没脾气的老实软柿子。", "trigger": "约好周末见面的相亲女生，出发前一小时突然发消息：“不好意思今天临时有点事，改天再约吧”", "warm_reply": "突发状况难免，你有急事就先安心处理。只是我为了今天特意推掉了原本的安排，多少还是有点小失落，等你忙完这阵我们再看吧。", "category": "相亲谈婚", "ch_num": 8, "id": "S220"}, {"bad_reply": "继续每周请吃大餐却一字不提关系，或突然搞当众隆重表白施压 —— 前者沦为“钱没少花手没拉上”的冤种，后者缺乏铺垫易把女生架在火上烤。", "confident_reply": "咱们也是奔着结婚相亲认识的，接触这几次我觉得你性格和三观都很合拍。相亲拼的也是时间成本，如果你也觉得合适，咱们就正式定下来认真处；要是还在观望也没事，别互相耽误就行。", "followup_tip": "如果用幽默版“预设未来”她顺着畅想相处细节，当晚散步过马路自然牵起手就能定情；如果果断摊牌后她依然打太极说“再看看”，果断体面撤退换人。", "humorous_reply": "突然想采访你一下，要是咱俩正式在一起了，你是喜欢周末腻一块儿到处逛吃，还是各自留点独处充电的小空间呀？", "keywords": ["确定关系", "表白", "三次见面", "摊牌", "推进关系", "追问态度"], "stage": "暧昧期", "subtext": "相亲见三四次还不排斥，要么就差你主动捅破窗户纸，要么她在吊着你对比别人，必须在新鲜感耗尽或被人截胡前拿个准话。", "trigger": "和相亲女生已经见了三四次面，吃喝聊都挺好但关系一直卡着不明确，怎么自然挑明不当冤大头？", "warm_reply": "这几次跟你见面待在一块儿，我感觉特别踏实放松。我不是喜欢暧昧拖着的人，挺想以男朋友的身份正式照顾你的，你怎么想？", "category": "相亲谈婚", "ch_num": 8, "id": "S221"}, {"bad_reply": "“你一个月工资能攒下多少？平时爱不爱买名牌包？” —— 充满防贼式查账感，哪怕本身节俭持家的好姑娘也会觉得你算计抠门而瞬间下头。", "confident_reply": "顺便好奇问个走心题，你长这么大收到过最让你觉得有意义的一份礼物是什么？我想看看咱们对“值不值”这件事的默契度怎么样。", "followup_tip": "结合她的日常穿搭和回答交叉验证：若收入普通却满口高奢包、网红下午茶与频繁出国游，需警惕超前透支；若津津乐道用心小物或周边短途游，说明消费观健康踏实。", "humorous_reply": "每次发完工资我都把钱分成“生存基金”和“快乐基金”，好奇你们女孩子平时周末续命，最爱把快乐基金花在哪儿呀？", "keywords": ["消费观", "花钱习惯", "月光族", "物质", "工资怎么花", "储蓄"], "stage": "相亲局", "subtext": "直接问“攒不攒钱”谁都会背“理性消费”的标准答案，只有借长假去向和礼物偏好做具象投射，才能无痛还原她真实的物质欲望。", "trigger": "想摸清相亲女生的日常消费观和储蓄习惯，怎么聊才不像查账审问、又能听出真话？", "warm_reply": "前阵子小长假你是怎么过的呀，跟闺蜜出去玩了还是宅家休息？平时长假看一个人怎么安排，最能看出喜欢什么样的生活状态了。", "category": "相亲谈婚", "ch_num": 8, "id": "S222"}, {"bad_reply": "“那太巧了，我这人脾气好特别会疼人，以后肯定对你好！” —— 连对方定义的“好”是什么都没摸清就盲目画饼接盘，婚后极易因预期错位天天吵架。", "confident_reply": "“合得来、对我好”这几个字挺宽泛的，我比较喜欢把话落在实处。比如以后咱俩意见不一致了，或者平时过节，你理想中舒服的相处模式具体是什么样的？", "followup_tip": "仔细分辨她的举例：能说出“下班顺路接我、吵架不冷战、有事商量”等具体小事的姑娘踏实真诚；若说“有心之人不用教”或把对她好等同于无条件给钱顺从，趁早避坑。", "humorous_reply": "完了，我发现说“要求不高”往往才是最高难度的隐藏考题哈哈！快给我漏点题，在你这儿具体做哪两件小事能拿“对你好”的及格分？", "keywords": ["对我好", "三观合", "仪式感", "要求不高", "感情观", "潜台词"], "stage": "相亲局", "subtext": "“要求不高、对我好就行”背后往往两极分化：要么是好哄重细节，要么是要求无底线物质供养与情绪顺从，必须二次追问拉到具体小事对齐。", "trigger": "聊感情观时女生背模板说：“其实我要求不高，只要三观合得来、对我好有仪式感就行”，怎么接话摸出真底线？", "warm_reply": "每个人心里对“好”和“仪式感”的画面其实不太一样，你是更看重下班顺手带杯热奶茶、记着你忌口这种日常细节，还是逢年过节一定要有隆重大惊喜呀？", "category": "相亲谈婚", "ch_num": 8, "id": "S223"}, {"bad_reply": "“你以前谈过几个男朋友？最长谈了多久？为什么分手的？” —— 像HR背调盘问隐私，不仅只能听到“官方三段”假话，还显得你充满猜忌。", "confident_reply": "我觉得过去谈过几次不重要，重要的是有没有从里面沉淀出清晰的自我认知。回顾上一段感情结束，你觉得主要是性格节奏不合，还是彼此都有需要成长的地方？", "followup_tip": "牢记两条识人铁律：①死咬“没标准、全看感觉”的往往最情绪化、最不稳定（没有标准就是随时拒绝你的最大标准）；②把分手原因100%恶毒甩锅前任、自己零反思的，婚后遇事也会全怪你。", "humorous_reply": "不问你谈过几次这种老掉牙的问题哈哈，换个好玩的——如果要给你理想型的男生贴三个关键词标签，不能说“看感觉”耍赖皮，你会选哪三个？", "keywords": ["前任", "谈过几次", "情史", "择偶标准", "喜欢什么类型", "看感觉"], "stage": "升温期", "subtext": "直接盘问恋爱次数没人说实话；借理想型具体度和前任雷区侧推，既能摸清经历深浅，又能检验她的归因成熟度与专一稳定性。", "trigger": "想了解相亲女生的过往情史和感情雷区，不想傻问“你谈过几个前任”，怎么高情商侧推？", "warm_reply": "每个人走过一段感情都会更清楚自己要什么，以你过去的体会，感情里最让你受不了、绝对不能碰的雷点是什么呀？我也提前避避雷。", "category": "相亲谈婚", "ch_num": 8, "id": "S224"}, {"bad_reply": "“你平时在家做饭做家务吗？有没有什么坏习惯和臭脾气？” —— 像挑保姆兼审犯人，任何有自尊的女生都会立刻开启防御模式怼回去。", "confident_reply": "谈恋爱看优点，奔着结婚过日子咱得看看能不能包容彼此的缺点。我平时忙起来回消息偶尔慢半拍，你呢，平时生活里是偏宅偏懒的性子，还是爱热闹常跟朋友聚？", "followup_tip": "用“大事讲原则，小事讲风格”标尺衡量：不爱做家务、爱网购赖床属小事风格（家电外卖都能解决）；但若透出爱混夜店彻夜不归、圈子混乱或情绪失控，属原则红线一票否决。", "humorous_reply": "我先坦白一个我的小毛病，我周末早上赖床得靠咖啡开机，不过做饭洗碗还算勤快哈哈。要是以咱们以后住一块儿为前提，你觉得自己哪个小习惯最需要我提前适应一下？", "keywords": ["缺点", "生活习惯", "家务", "作息", "脾气", "磨合"], "stage": "升温期", "subtext": "颜值滤镜终会褪去，婚姻拼的是长期生活习惯耐受度；先自曝无伤大雅的小毛病卸下防备，再反向问“受不了什么”最容易听见实话。", "trigger": "婚前想摸底女生的真实作息、家务观和生活习惯，直接问“你有什么缺点”怕冷场，怎么自然套话？", "warm_reply": "两个人相处不可能十全十美，我一直觉得小事讲风格、大事讲原则。平时生活里你最不能接受另一半有什么习惯呀？比如乱丢袜子还是熬夜打游戏？", "category": "相亲谈婚", "ch_num": 8, "id": "S225"}, {"bad_reply": "“你爸妈脾气好不好相处？家里有没有养老负担，是不是你妈说了算？” —— 功利算计感扑面而来，直接触碰女生维护原生家庭的逆鳞。", "confident_reply": "我家里平时遇到大事都是爸妈商量着来、氛围比较民主。你们家平时遇到大决定一般听叔叔的还是阿姨的？提前取取经，以后见长辈我心里也有个数。", "followup_tip": "从她的描述重点观察两点：①父母遇事是有商有量还是单方强势冷暴力（父母怎么相处，她婚后大概率怎么复制）；②她是独立有主见还是事事“听我妈的”（防过度干涉小家边界）。", "humorous_reply": "看你性格这么爽朗，突然挺好奇你小时候在家是乖乖听话的模范生，还是敢跟爸妈斗智斗勇的小头目呀？", "keywords": ["原生家庭", "家庭情况", "父母关系", "家里谁做主", "家风", "查户口"], "stage": "升温期", "subtext": "原生家庭是未来小家相处模式的预演，直接盘问父母背景显生硬，借童年趣事与家庭亲密度切入，最能让她毫无防备地展现真实家风。", "trigger": "想了解女生的原生家庭氛围、父母好不好相处以及她在家里的性格角色，怎么自然切入？", "warm_reply": "平时听你提家里感觉氛围挺温暖的，你在家是跟爸爸关系更铁一点，还是什么悄悄话都爱跟妈妈讲呀？", "category": "相亲谈婚", "ch_num": 8, "id": "S226"}, {"bad_reply": "“平时上班圈子太窄没人喜欢我 / 前女友太物质把我伤透了” —— 一句话同时暴露没魅力、抱怨甩锅格局小，直接把刚升起的好感浇灭。", "confident_reply": "如果只是为了完成任务而结婚，我宁愿单着；但如果是跟真心喜欢、三观同频的人组建小家，我随时准备好了，也有十足底气给未来另一半安稳的保障。现在就看咱俩能不能修成正果了。", "followup_tip": "答完留意她的眼神与羞涩反应：如果她笑着反问“那你觉得我算对的人吗”或低头浅笑，说明好感窗口已彻底打开，紧接着即可顺势邀约下次深度约会。", "humorous_reply": "以前总觉得一个人吃饱全家不饿挺潇洒，直到看身边哥们下班有人一起逛超市买菜，才发现原来我不是不想结婚，是在等那个能让我甘心交出副驾的人出现呀。", "keywords": ["为什么单身", "单身原因", "想结婚吗", "看上你", "着急结婚", "婚恋观"], "stage": "相亲局", "subtext": "女生相亲主动追问单身原因和结婚意愿，绝对是对你有好感、在确认你是否专一靠谱并试探成家诚意的强烈积极信号！", "trigger": "相亲女生主动好奇问你：“感觉你各方面条件挺不错的，怎么一直单身到现在呀？想快点结婚吗？”", "warm_reply": "之前也有过接触的人，但我对感情不太愿意将就，觉得没遇到真想照顾一辈子的人就仓促开始，对人家也不负责。现在事业和心态都稳了，如果遇到对的你，我很期待一起买菜做饭、出门看世界的小日子。", "category": "相亲谈婚", "ch_num": 8, "id": "S227"}, {"bad_reply": "暴躁抢手机查记录或卑微追问“你跟他到底什么关系，是不是不在乎我？” —— 无证据抓闹在对方眼里只是无能狂怒，反而坐实你“小心眼控制欲强”的罪名。", "confident_reply": "成年人的感情先有规矩再谈真心，我不接受另一半有边界模糊的异性圈子，同样这一点你也可以随时监督我。既然你觉得沟通分寸感是胡思乱想，那咱们各自冷静几天，想清楚要什么样的关系再聊吧。", "followup_tip": "说完立刻收回热情、停止日常接送和转账关心（断供抽离）。真正珍惜你的人会慌乱主动切割越界异性来哄你；若她顺势回“随便你吧 : 8, "id": "S230"}, {"bad_reply": "“阿姨你们家要多少您直说 / 这事我做不了主，您得问我爸妈” —— 前者直接交出定价权等着被漫天要价，后者像没断奶的无担当巨婴，长辈瞬间看轻你。", "confident_reply": "阿姨您放心，我既然认准了她，礼数和诚意绝对不含糊。不过她在您二老心里是无价的，由我一个晚辈直接开口报数太失礼了，这周末我安排我爸妈过来跟您二老坐在一块儿共同商议，一定办得热热闹闹、两家都舒心。", "followup_tip": "首轮切记核心八字诀：“升维定性，不接数字”。先把叔叔阿姨养育女儿的含辛茹苦捧到位，再顺理成章定下“双方父母共同商议”框架，防止单方面狮子大开口。", "humorous_reply": "阿姨，您这一下可考住我了哈哈！我要是直接报个数字，搞得像做买卖谈价格一样多俗气呀。不管我们家给多少，都抵不过您和叔叔把她养这么优秀的含辛茹苦，这大事还得请我爸妈登门跟您二老正式商量，肯定让您脸上有面儿！", "keywords": ["丈母娘", "问彩礼", "见家长", "岳母", "彩礼报价", "长辈试探"], "stage": "谈婚期", "subtext": "准丈母娘亲自开口并非单纯要高价，而是在婚前最后一关考验你的情商、诚意与家庭教养。晚辈直接报价伤感情，甩锅爸妈显巨婴。", "trigger": "登门拜访或两家商量婚事前，准丈母娘笑眯眯直接问你：“小陈啊，你们家那边准备给多少彩礼呀？”", "warm_reply": "阿姨，结婚是我们两个家庭结亲的大喜事，在我心里彩礼从来不是冷冰冰的数目，而是我们家对您二老养育之恩的感激和对她的尊重。具体礼数让我爸妈跟您和叔叔一起商量着定，我相信长辈们肯定会为我们小家未来考虑周全的。", "category": "相亲谈婚", "ch_num": 8, "id": "S231"}, {"bad_reply": "被逼急了脱口交底“我爸妈说最多拿12万，多了真拿不出” —— 底牌一亮立刻沦为菜市场拉锯砍价，少了女方嫌寒酸，加钱自己掏空家底。", "confident_reply": "我爸妈确实跟我交过心，他们说两家结亲不是做生意，只要您二老真心接纳我、咱们处成相亲相爱的一家人，礼数上绝不委屈姑娘，更会给我们小家留足起步底气。好久没陪叔叔喝两杯了，这周六我先带点好茶回来看望您二老，咱们边吃家常饭边聊！", "followup_tip": "谈判最高境界是“把关系从谈判桌上拉回饭桌上”！反问一句“能不能把我当一家人喜欢”礼貌封死继续逼问的路径，周末拎着水果好菜登门嘴甜勤快点，丈母娘心一软往往主动让步。", "humorous_reply": "阿姨您是不知道，我们家传统大事向来是我爸妈拍板，我要是敢抢着瞎做主回去得挨训哈哈！不过我爸妈特别通情达理，老念叨以后两个孩子日子过得好比啥都强。对了阿姨，上次吃过您做的红烧肉我一直馋到现在，这周末我买好排骨登门蹭顿饭，顺便看看您能不能把我当半个儿子喜欢？", "keywords": ["丈母娘追问", "爸妈透底", "彩礼底牌", "逼问", "打太极", "见岳母"], "stage": "谈婚期", "subtext": "这是长辈在探你家的预算底数！一旦当场漏底就会陷入讨价还价泥潭，必须搬出家风传统挡箭，再借家常菜把博弈拉回温情饭桌。", "trigger": "准丈母娘继续追问底牌：“现在都是你们年轻人自己做主，来之前你爸妈就没给你透个底吗？”", "warm_reply": "阿姨，我们家传统在婚姻大事上特别讲礼数，得双方长辈见面才定数。但我爸妈一直说，钱是为人服务的，最看重我们小家以后的幸福。而且我早把您和叔叔当自己亲爸妈看待了，将来结余下来的钱也是用来孝敬咱双方爸妈的，就是不知道我能不能被您二老当成一家人喜欢呀？", "category": "相亲谈婚", "ch_num": 8, "id": "S232"}, {"bad_reply": "老实精确到百位数“月薪8300，卡里存了16万5”或呛声“刚认识就问钱是不是太现实了” —— 前者毫无底牌沦为透明肥羊，后者情商归零当场聊崩。", "confident_reply": "目前主业稳定上升，手头有一笔稳健理财的备用金，无外债无不良征信，结婚成家的底气还是足的。我觉得好的婚姻确实得大大方方谈钱，不过线上三言两语说不透，周末出来喝杯咖啡咱们当面坦诚聊？", "followup_tip": "线下深入聊收入时切记“报稳健区间不报死数、留三分底牌”，同时顺势反问她对未来生活开支与储蓄的看法，把单向被审视转化为平等双向考察。", "humorous_reply": "哈哈这么快就进入财务政审环节啦？目前主业收   }

    } else {
      fallbackCopy(text);
    }
  };

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');

    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

    const safe = esc(str);
    if (!q) return safe;
    const terms = q.trim().split(/\s+/).filter(Boolean);

    return out;

          </div>
          <div class="reply-text">${hi(hText, q)}</div>

            <button class="copy-btn" data-copy="${esc(cText)}" onclick="copyReply(this.getAttribute('data-copy'))">复制</button>
          </div>
          <div class="reply-text">${hi(cText, q)}</div>
        </div>

        <button class="sc-more-toggle" onclick="toggleMore(this)">
          <span>❌ 直男踩坑 & 💡 下一步跟进</span>
          <span class="arr">避坑对比与下一步衔接 ▼</span>
        </button>
        <div class="sc-more-body">
          <div class="bad-box"><strong>❌ 踩坑示范：</strong>${esc(c.bad_reply)}</div>
          <div class="tip-box"><strong>💡 下一步衔接：</strong>${esc(c.followup_tip)}</div>
        </div>
      </div>
    `;
  }

  function filterCards() {
    const q = searchQuery.trim().toLowerCase();
    return cards.filter(c => {
      if (selectedCat !== '全部' && c.category !== selectedCat) return false;
      if (!q) return true;
      const hay = [
        c.trigger, c.category, c.stage, c.subtext,
        (c.keywords || []).join(' '),
        c.humorous_reply, c.warm_reply, c.confident_reply, c.followup_tip
      ].join(' ').toLowerCase();
      return q.split(/\s+/).every(term => hay.includes(term));
    });
  }

  window.setCat = function(cat) {
    selectedCat = cat;
    renderHeaderControls();
    renderMain();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.setHotWord = function(w) {
    selectedCat = '全部';
    searchQuery = w;
    const inp = document.getElementById('searchInput');
    if (inp) inp.value = w;
    document.getElementById('clearBtn').style.display = w ? 'flex' : 'none';
    renderHeaderControls();
    renderMain();
  };

  window.openChapter = function(num) {
    currentChapter = num;
    localStorage.setItem('dy_book_ch', String(num));
    switchTab('book');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.jumpToCatFromBook = function(cat) {
    selectedCat = cat;
    searchQuery = '';
    switchTab('search');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.addCustomNote = function() {
    const t = document.getElementById('custTrigger').value.trim();
    const r = document.getElementById('custReply').value.trim();
    if (!t || !r) { showToast('请填写场景和话术内容'); return; }
    customNotes.unshift({ id: 'C' + Date.now(), trigger: t, reply: r });
    localStorage.setItem('dy_custom_notes', JSON.stringify(customNotes));
    renderMain();
    showToast('✓ 已保存专属话术');
  };

  window.delCustomNote = function(id) {
    customNotes = customNotes.filter(x => x.id !== id);
    localStorage.setItem('dy_custom_notes', JSON.stringify(customNotes));
    renderMain();
  };

  function renderHeaderControls() {
    const searchArea = document.getElementById('searchControls');
    const hotArea = document.getElementById('hotTagsArea');
    if (activeTab === 'search') {
      searchArea.style.display = 'block';
      hotArea.style.display = 'flex';
      const pills = document.getElementById('catPills');
      pills.innerHTML = CATEGORIES.map(cat => {
        const cnt = cat === '全部' ? cards.length : cards.filter(x => x.category === cat).length;
        return `<button class="pill ${selectedCat === cat ? 'active' : ''}" onclick="setCat('${cat}')">${cat} <span style="opacity:0.75;font-size:0.74rem">${cnt}</span></button>`;
      }).join('');
      hotArea.innerHTML = `<span style="font-size:0.75rem;color:var(--text-3);flex-shrink:0;padding:4px 2px">救急热词:</span>` +
        HOT_WORDS.map(w => `<button class="hot-tag" onclick="setHotWord('${w}')">${w}</button>`).join('');
    } else if (activeTab === 'book') {
      searchArea.style.display = 'block';
      hotArea.style.display = 'none';
      document.querySelector('.search-wrap').style.display = 'none';
      const pills = document.getElementById('catPills');
      pills.innerHTML = chapters.map(ch =>
        `<button class="pill ${currentChapter === ch.ch_num ? 'active' : ''}" onclick="openChapter(${ch.ch_num})">第${ch.ch_num}章 · ${esc(ch.title.split('：')[0].replace('篇',''))}</button>`
      ).join('');
      return;
    } else {
      searchArea.style.display = 'none';
      hotArea.style.display = 'none';
    }
    if (activeTab === 'search') {
      document.querySelector('.search-wrap').style.display = 'flex';
    }
  }

  function renderMain() {
    const main = document.getElementById('mainContent');
    if (activeTab === 'search') {
      const matched = filterCards();
      main.innerHTML = `
        <div class="stats-bar">
          <span>共找到 <strong>${matched.length}</strong> 个场景（${matched.length * 3} 条可复制回复）</span>
          ${searchQuery ? `<span style="color:var(--primary);cursor:pointer" onclick="setHotWord('')">清除筛选</span>` : ''}
        </div>
        ${matched.length ? matched.map(c => renderCardHTML(c, searchQuery)).join('') : '<div style="text-align:center;padding:48px 20px;color:var(--text-3)">没有找到完全匹配的词，换个简短关键词试试（如“吃饭”“累”“冷淡”）</div>'}
      `;
    } else if (activeTab === 'book') {
      const ch = chapters.find(x => x.ch_num === currentChapter) || chapters[0];
      const catMap = {1:'日常闲聊',2:'初识破冰',3:'好感信号',4:'测试接招',5:'关心安慰',6:'线下邀约',7:'冷淡破局',8:'相亲谈婚'};
      const pairedCat = catMap[ch.ch_num] || '全部';
      main.innerHTML = `
        <div class="ch-header-card">
          <div class="ch-kicker">CHAPTER 0${ch.ch_num} / 08 · 系统实战教程</div>
          <h2 class="ch-title">${esc(ch.title)}</h2>
          <p class="ch-sub">${esc(ch.subtitle)}</p>
          <ul class="takeaway-list">
            ${(ch.core_takeaways || []).map(t => `<li>${esc(t)}</li>`).join('')}
          </ul>
          <div style="margin-top:12px">
            <button class="icon-btn" style="width:100%;padding:9px;color:var(--primary);border-color:var(--primary)" onclick="jumpToCatFromBook('${pairedCat}')">⚡ 查看本章配套【${pairedCat}】实战话术卡 →</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button onclick="downloadDecryptedEpub()" class="icon-btn" style="flex:1;text-align:center">📥 下载 EPUB 电子书到手机</button>
            
          </div>
        </div>
        ${(ch.sections || []).map(sec => {
          const dc = sec.dialogue_contrast || {};
          return `
            <div class="book-sec">
              <h3>${esc(sec.heading)}</h3>
              ${String(sec.teaching_body || '').split(/\n+/).filter(Boolean).map(p => `<p class="book-p">${esc(p)}</p>`).join('')}
              <div class="chat-compare">
                <div class="chat-sit">💬 实战场景：${esc(dc.situation)}</div>
                <div class="chat-bad"><strong>❌ 直男踩坑：</strong>\n${esc(dc.bad_chat)}</div>
                <div class="chat-good"><strong>✅ 高情商升温：</strong>\n${esc(dc.good_chat)}</div>
                <div class="chat-ana">🎯 <strong>拆解点睛：</strong>${esc(dc.analysis)}</div>
              </div>
              <div class="sec-tip">💡 实操锦囊：${esc(sec.action_tip)}</div>
            </div>
          `;
        }).join('')}
        <div class="pitfall-card">
          <h3 style="margin:0 0 10px;font-size:1rem">⚠️ 本章自查避坑清单</h3>
          <ul class="takeaway-list" style="background:var(--surface-2)">
            ${(ch.pitfall_checklist || []).map(p => `<li>${esc(p)}</li>`).join('')}
          </ul>
        </div>
        <div class="ch-nav-btns">
          <button ${ch.ch_num <= 1 ? 'disabled style="opacity:0.4"' : `onclick="openChapter(${ch.ch_num - 1})"`}>← 上一章</button>
          <button class="primary" ${ch.ch_num >= chapters.length ? `onclick="switchTab('search')"` : `onclick="openChapter(${ch.ch_num + 1})"`}>
            ${ch.ch_num >= chapters.length ? '去查实战话术 ⚡' : '下一章 →'}
          </button>
        </div>
      `;
    } else if (activeTab === 'roadmap') {
      const stages = [
        { title: '① 刚加微信 / 相亲初识（破冰期）', desc: '不知道第一句发什么、怕一问一答查户口冷场', cat: '初识破冰', ch: 2 },
        { title: '② 日常微信闲聊（升温期）', desc: '早晚安、在干嘛、她发美食/自拍，想聊出轻松暧昧氛围', cat: '测试接招', ch: 4 },
        { title: '③ 判断她喜不喜欢我（解码期）', desc: '拿不准她是在矜持试探还是委婉拒绝，想测出真实好感度', cat: '好感信号', ch: 3 },
        { title: '④ 她喊累 / 生病 / 心情不好（共情期）', desc: '不想干巴巴说“多喝热水”，想真正走进她心里建立偏爱感', cat: '关心安慰', ch: 5 },
        { title: '⑤ 准备约出来见面 / 升级关系（邀约期）', desc: '怕约被拒尴尬，想知道怎么低压力邀约、怎么安排约会转场', cat: '线下邀约', ch: 6 },
        { title: '⑥ 她突然冷淡 / 慢回 / 闹小脾气（破局期）', desc: '消息回得慢、气氛变淡或吵架了，想体面破冰不卑微', cat: '冷淡破局', ch: 7 },
        { title: '⑦ 相亲深入沟通与谈婚论嫁（长期期）', desc: '摸底三观家庭、应对长辈谈彩礼与现实条件博弈', cat: '相亲谈婚', ch: 8 },
        { title: '⑧ 稳住自我内核（底层心态基石）', desc: '容易患得患失、秒回讨好、需求感太强？先花5分钟调正心态', cat: '日常闲聊', ch: 1 }
      ];
      main.innerHTML = `
        <div class="ch-header-card">
          <div class="ch-kicker">QUICK NAVIGATOR · 关系阶段急救地图</div>
          <h2 class="ch-title" style="font-size:1.15rem">你和她现在处于哪个阶段？</h2>
          <p class="ch-sub" style="margin-bottom:0">点选对应情境，直达精选话术库或核心教程章节：</p>
        </div>
        <div class="stage-grid">
          ${stages.map(s => `
            <div class="stage-card">
              <h4>${s.title}</h4>
              <p>${s.desc}</p>
              <div style="display:flex;gap:8px">
                <button class="icon-btn" style="flex:1;color:var(--primary);border-color:var(--primary)" onclick="jumpToCatFromBook('${s.cat}')">⚡ 查【${s.cat}】话术</button>
                <button class="icon-btn" style="flex:1" onclick="openChapter(${s.ch})">📖 读第 ${s.ch} 章教程</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    } else if (activeTab === 'fav') {
      const favCards = cards.filter(c => starredIds.has(c.id));
      main.innerHTML = `
        <div class="custom-form">
          <div style="font-weight:700;font-size:0.95rem;margin-bottom:8px">✍️ 添加我的专属备用话术</div>
          <input id="custTrigger" placeholder="场景备注（例：她周末加班结束怎么接）" />
          <textarea id="custReply" rows="2" placeholder="输入你觉得好用的高情商回复..."></textarea>
          <button class="icon-btn" style="width:100%;background:var(--primary);color:#fff;border:none;padding:9px" onclick="addCustomNote()">+ 保存到本机收藏夹</button>
        </div>
        ${customNotes.map(n => `
          <div class="sc-card">
            <div class="sc-top">
              <span class="badge-cat">个人自建</span>
              <button class="icon-btn" style="padding:2px 8px;font-size:0.72rem" onclick="delCustomNote('${n.id}')">删除</button>
            </div>
            <div class="sc-trigger">${esc(n.trigger)}</div>
            <div class="reply-box reply-warm" style="margin-bottom:0">
              <div class="reply-head">
                <span class="reply-label">⭐ 专属话术</span>
                <button class="copy-btn" data-copy="${esc(n.reply)}" onclick="copyReply(this.getAttribute('data-copy'))">复制</button>
              </div>
              <div class="reply-text">${esc(n.reply)}</div>
            </div>
          </div>
        `).join('')}
        <div class="stats-bar"><span>已标星收藏的话术卡（${favCards.length} 张）</span></div>
        ${favCards.length ? favCards.map(c => renderCardHTML(c, '')).join('') : '<div style="text-align:center;padding:36px 20px;color:var(--text-3)">还没有收藏卡片，在「搜话术」右上角点 ☆ 即可收藏常用金句</div>'}
      `;
    }
  }

  window.switchTab = function(tab) {
    activeTab = tab;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    renderHeaderControls();
    renderMain();
  };

  window.toggleTheme = function() {
    theme = theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('dy_theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
  };

  window.cycleFont = function() {
    const scales = [1, 1.1, 1.2];
    const idx = (scales.indexOf(fontScale) + 1) % scales.length;
    fontScale = scales[idx];
    document.documentElement.style.setProperty('--font-scale', fontScale);
    localStorage.setItem('dy_font_scale', String(fontScale));
    showToast(fontScale === 1 ? '字号：标准' : (fontScale === 1.1 ? '字号：大号' : '字号：特大'));
  };

  window.__bootBookApp = function() {
    document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
    const inp = document.getElementById('searchInput');
    const clr = document.getElementById('clearBtn');
    inp.addEventListener('input', function() {
      searchQuery = inp.value;
      clr.style.display = searchQuery ? 'flex' : 'none';
      renderMain();
    });
    clr.addEventListener('click', function() {
      searchQuery = '';
      inp.value = '';
      clr.style.display = 'none';
      renderMain();
      inp.focus();
    });
    renderHeaderControls();
    renderMain();
  });
})();
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
