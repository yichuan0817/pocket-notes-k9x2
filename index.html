<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="实战沟通宝典">
  <title>实战沟通宝典</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #f0eee9;
  --text: #1c1b19;
  --text-2: #5c5953;
  --text-3: #8c8880;
  --border: rgba(28, 27, 25, 0.09);
  --primary: #d95d39;
  --primary-soft: rgba(217, 93, 57, 0.11);
  --humorous: #d97706;
  --humorous-bg: #fffbeb;
  --warm: #0d9488;
  --warm-bg: #f0fdfa;
  --confident: #4f46e5;
  --confident-bg: #eef2ff;
  --bad-bg: #fef2f2;
  --bad-text: #b91c1c;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
  --font-scale: 1;
}
[data-theme="dark"] {
  --bg: #121214;
  --surface: #1c1c20;
  --surface-2: #27272d;
  --text: #f2f0ec;
  --text-2: #b5b2aa;
  --text-3: #7d7a73;
  --border: rgba(255, 255, 255, 0.09);
  --primary: #f0714b;
  --primary-soft: rgba(240, 113, 75, 0.16);
  --humorous: #fbbf24;
  --humorous-bg: rgba(251, 191, 36, 0.11);
  --warm: #2dd4bf;
  --warm-bg: rgba(45, 212, 191, 0.11);
  --confident: #818cf8;
  --confident-bg: rgba(129, 140, 248, 0.12);
  --bad-bg: rgba(239, 68, 68, 0.12);
  --bad-text: #fca5a5;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: calc(16px * var(--font-scale));
  line-height: 1.65;
  overscroll-behavior-y: none;
}
.app-container {
  max-width: 680px;
  margin: 0 auto;
  padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
}
.top-header {
  position: relative;
  z-index: 40;
  background: var(--bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  border-bottom: 1px solid var(--border);
}
.brand-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.brand-title {
  font-size: 1.12rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px;
}
.brand-badge {
  font-size: 0.7rem; font-weight: 600; color: var(--primary); background: var(--primary-soft);
  padding: 2px 8px; border-radius: 99px;
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  border-radius: 10px; padding: 6px 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.search-wrap {
  position: relative; display: flex; align-items: center;
}
.search-input {
  width: 100%; padding: 11px 38px 11px 38px;
  border-radius: 14px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 0.96rem; outline: none; transition: border-color 0.15s;
  box-shadow: var(--shadow);
}
.search-input:focus { border-color: var(--primary); }
.search-icon {
  position: absolute; left: 13px; color: var(--text-3); pointer-events: none; font-size: 0.95rem;
}
.clear-btn {
  position: absolute; right: 10px; border: none; background: var(--surface-2); color: var(--text-2);
  width: 22px; height: 22px; border-radius: 50%; font-size: 0.8rem; cursor: pointer; display: none;
  align-items: center; justify-content: center; padding: 0;
}
.pill-scroll {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 0 3px;
}
.pill {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  padding: 5px 11px; border-radius: 99px; font-size: 0.8rem; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: all 0.15s; line-height: 1.25;
}
.pill:hover { border-color: var(--primary); }
.pill.active {
  background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600;
}
.hot-tags {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 4px; align-items: center;
}
.hot-tag {
  flex-shrink: 0; background: var(--surface-2); color: var(--text-2); border: none;
  padding: 4px 10px; border-radius: 8px; font-size: 0.76rem; cursor: pointer;
}
.section-body { padding: 10px 14px; }
.stats-bar {
  font-size: 0.78rem; color: var(--text-3); padding: 2px 4px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.sc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.sc-top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;
}
.sc-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge-cat {
  font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  background: var(--primary-soft); color: var(--primary);
}
.badge-stage {
  font-size: 0.72rem; padding: 2px 7px; border-radius: 6px;
  background: var(--surface-2); color: var(--text-2);
}
.star-btn {
  border: none; background: transparent; font-size: 1.18rem; cursor: pointer; padding: 0 2px; line-height: 1;
  color: var(--text-3);
}
.star-btn.starred { color: #f59e0b; }
.sc-trigger {
  font-size: 1.02rem; font-weight: 700; color: var(--text); margin: 4px 0 8px; line-height: 1.45;
}
.sc-subtext {
  font-size: 0.84rem; color: var(--text-2); background: var(--surface-2);
  padding: 8px 11px; border-radius: 10px; margin-bottom: 10px;
}
.reply-box {
  border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  border: 1px solid var(--border); position: relative;
}
.reply-humorous { background: var(--humorous-bg); }
.reply-warm { background: var(--warm-bg); }
.reply-confident { background: var(--confident-bg); }
.reply-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
}
.reply-label { font-size: 0.76rem; font-weight: 700; }
.reply-humorous .reply-label { color: var(--humorous); }
.reply-warm .reply-label { color: var(--warm); }
.reply-confident .reply-label { color: var(--confident); }
.copy-btn {
  border: none; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
}
.copy-btn:active { transform: scale(0.96); }
.reply-text {
  font-size: 0.94rem; color: var(--text); line-height: 1.55; word-break: break-word;
}

.hook-step2 {
  margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 0.86rem; color: var(--text-2);
}
.hook-cond { font-size: 0.75rem; color: var(--primary); font-weight: 600; margin-right: 4px; }

.sc-more-toggle {
  width: 100%; text-align: left; border: none; background: transparent;
  color: var(--text-3); font-size: 0.8rem; padding: 4px 0 0; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.sc-more-body {
  display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
  font-size: 0.84rem;
}
.sc-more-body.open { display: block; }
.bad-box {
  background: var(--bad-bg); color: var(--bad-text); padding: 8px 10px;
  border-radius: 9px; margin-bottom: 7px; line-height: 1.5;
}
.tip-box {
  color: var(--text-2); padding: 4px 2px; line-height: 1.5;
}
mark {
  background: rgba(245, 158, 11, 0.32); color: inherit; padding: 0 2px; border-radius: 3px;
}

/* Book Reader Tab */
.ch-header-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.ch-kicker { font-size: 0.78rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.ch-title { font-size: 1.25rem; font-weight: 800; line-height: 1.35; margin: 0 0 6px; }
.ch-sub { font-size: 0.88rem; color: var(--text-2); margin: 0 0 12px; }
.takeaway-list {
  background: var(--primary-soft); border-radius: 12px; padding: 12px 14px; margin: 0; list-style: none;
}
.takeaway-list li {
  font-size: 0.86rem; margin-bottom: 7px; position: relative; padding-left: 18px; line-height: 1.5;
}
.takeaway-list li:last-child { margin-bottom: 0; }
.takeaway-list li::before {
  content: "✦"; position: absolute; left: 0; color: var(--primary); font-weight: bold;
}
.book-sec {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.book-sec h3 { font-size: 1.06rem; margin: 0 0 10px; line-height: 1.4; color: var(--text); }
.book-p { font-size: 0.95rem; color: var(--text); margin: 0 0 12px; line-height: 1.75; }
.chat-compare {
  background: var(--surface-2); border-radius: 13px; padding: 12px; margin: 12px 0;
}
.chat-sit { font-size: 0.82rem; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
.chat-bad {
  background: var(--bad-bg); color: var(--bad-text); border-radius: 10px; padding: 9px 11px;
  font-size: 0.86rem; margin-bottom: 8px; white-space: pre-line;
}
.chat-good {
  background: var(--warm-bg); color: var(--text); border-left: 3px solid var(--warm);
  border-radius: 8px; padding: 9px 11px; font-size: 0.88rem; margin-bottom: 8px; white-space: pre-line;
}
.chat-ana { font-size: 0.82rem; color: var(--text-2); line-height: 1.55; }
.sec-tip {
  font-size: 0.85rem; font-weight: 600; color: var(--primary);
  background: var(--primary-soft); padding: 9px 12px; border-radius: 10px;
}
.pitfall-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; margin-bottom: 16px;
}
.ch-nav-btns { display: flex; gap: 10px; margin: 16px 0 8px; }
.ch-nav-btns button {
  flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-weight: 600; font-size: 0.9rem; cursor: pointer;
}
.ch-nav-btns button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Roadmap Tab */
.stage-grid { display: grid; gap: 10px; }
.stage-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 15px;
  padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow);
}
.stage-card h4 { margin: 0 0 5px; font-size: 1rem; color: var(--primary); }
.stage-card p { margin: 0 0 8px; font-size: 0.85rem; color: var(--text-2); }

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.nav-item {
  flex: 1; max-width: 150px; border: none; background: transparent; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0; font-size: 0.72rem; font-weight: 600; cursor: pointer;
}
.nav-item .nav-ico { font-size: 1.2rem; line-height: 1.1; }
.nav-item.active { color: var(--primary); }

/* Toast */
.toast {
  position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(24, 24, 27, 0.92); color: #fff;
  padding: 9px 18px; border-radius: 99px; font-size: 0.85rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 100; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.custom-form {
  background: var(--surface); border: 1px solid var(--border); border-radius: 15px;
  padding: 14px; margin-bottom: 14px;
}
.custom-form input, .custom-form textarea {
  width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 10px; padding: 9px 11px; font-size: 0.9rem; margin-bottom: 8px; font-family: inherit;
}

.ai-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.ai-textarea {
  width: 100%; border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 13px; padding: 11px 12px; font-size: 0.96rem; font-family: inherit;
  line-height: 1.5; resize: none; outline: none; margin-top: 8px;
}
.ai-textarea:focus { border-color: var(--primary); }
.ai-toolbar {
  display: flex; gap: 8px; margin-top: 9px; align-items: center; flex-wrap: wrap;
}
.upload-btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px dashed var(--primary); background: var(--primary-soft); color: var(--primary);
  padding: 9px 12px; border-radius: 11px; font-size: 0.84rem; font-weight: 600; cursor: pointer;
}
.go-btn {
  width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 13px;
  background: var(--primary); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 12px rgba(217, 93, 57, 0.28);
}
.go-btn:disabled { opacity: 0.6; cursor: wait; }
.img-preview-wrap {
  position: relative; display: inline-block; margin-top: 10px;
}
.img-preview-wrap img {
  max-height: 150px; border-radius: 10px; border: 1px solid var(--border); display: block;
}
.img-rm-btn {
  position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
  border: none; background: #dc2626; color: #fff; font-size: 0.75rem; cursor: pointer;
}

.verbatim-box {
  background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px 0 8px;
  border-left: 3px solid var(--primary); font-size: 0.82rem;
}
.verb-item {
  padding: 6px 0; border-bottom: 1px dashed var(--border);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.verb-item:last-child { border-bottom: none; padding-bottom: 0; }

.refine-bar {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
}
.refine-chip {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  border-radius: 99px; padding: 5px 11px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
}
.refine-chip:active { background: var(--primary); color: #fff; }


    #lockScreen {
      position: fixed; inset: 0; z-index: 200; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .lock-card {
      width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px; padding: 28px 22px; text-align: center; box-shadow: var(--shadow);
    }
    .pin-input {
      width: 180px; text-align: center; font-size: 1.8rem; letter-spacing: 0.45em;
      padding: 12px 10px 12px 20px; border-radius: 14px; border: 2px solid var(--border);
      background: var(--bg); color: var(--text); outline: none; font-weight: 700;
      margin: 16px auto 10px; display: block;
    }
    .pin-input:focus { border-color: var(--primary); }
    .lock-err { color: #dc2626; font-size: 0.84rem; min-height: 1.3em; }
  </style>
</head>
<body>
  <div id="lockScreen">
    <div class="lock-card">
      <div style="font-size:2.2rem;margin-bottom:6px">🔒</div>
      <div style="font-size:1.15rem;font-weight:800;margin-bottom:4px">私密随身宝典</div>
      <div style="font-size:0.84rem;color:var(--text-2)">请输入 4 位访问密码解锁（本机解锁一次自动记忆）</div>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autofocus />
      <div id="lockErr" class="lock-err"></div>
      <button id="unlockBtn" class="icon-btn" style="width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:0.95rem;margin-top:6px">立即解锁</button>
    </div>
  </div>

  <div id="appRoot" style="display:none">
    <div class="app-container">
      <header class="top-header">
        <div class="brand-row">
          <div class="brand-title">
            <span>💬 恋爱沟通实战宝典</span>
            <span class="brand-badge">411场景 · 1233话术</span>
          </div>
          <div class="header-actions">
            <button class="icon-btn" onclick="cycleFont()" title="调整字号">A+</button>
            <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="深浅模式">🌙</button>
          </div>
        </div>
        <div id="searchControls">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input id="searchInput" class="search-input" type="search" placeholder="搜女生原话或场景：在干嘛 / 好累 / 约吃饭 / 冷淡..." autocomplete="off" />
            <button id="clearBtn" class="clear-btn">✕</button>
          </div>
          <div id="catPills" class="pill-scroll"></div>
        </div>
      </header>
      <div id="hotTagsArea" class="hot-tags"></div>
      <main id="mainContent" class="section-body"></main>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="ai" onclick="switchTab('ai')">
        <span class="nav-ico">🤖</span><span>AI帮回</span>
      </button>
      <button class="nav-item" data-tab="search" onclick="switchTab('search')">
        <span class="nav-ico">⚡</span><span>搜话术</span>
      </button>
      <button class="nav-item" data-tab="book" onclick="switchTab('book')">
        <span class="nav-ico">📖</span><span>看教程</span>
      </button>
      <button class="nav-item" data-tab="roadmap" onclick="switchTab('roadmap')">
        <span class="nav-ico">🧭</span><span>锦囊</span>
      </button>
      <button class="nav-item" data-tab="fav" onclick="switchTab('fav')">
        <span class="nav-ico">⭐</span><span>收藏</span>
      </button>
    </nav>
  </div>

    let __unlockedPin = null;

    function b64ToU8(b64) {
      const bin = atob(b64);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    }

    async function deriveAesKey(pin, saltB64) {
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToU8(saltB64), iterations: 100000, hash: 'SHA-256' },
        keyMat,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function tryUnlock(pin, silent) {
      try {
        const key = await deriveAesKey(pin, ENC_BUNDLE.salt);
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToU8(ENC_BUNDLE.iv) },
          key,
          b64ToU8(ENC_BUNDLE.ct)
        );
        const jsonStr = new TextDecoder().decode(plainBuf);
        window.__BOOK_DATA__ = JSON.parse(jsonStr);
        __unlockedPin = pin; window.__ACTIVE_PIN__ = pin;
        localStorage.setItem('dy_saved_pin_v1', pin);
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('appRoot').style.display = 'block';
        window.__bootBookApp();
        return true;
      } catch (e) {
        if (!silent) {
          document.getElementById('lockErr').textContent = '密码不对，请重新输入';
          document.getElementById('pinInput').value = '';
        }
        return false;
      }
    }

    window.downloadDecryptedEpub = async function() {
      try {
        const t = document.getElementById('toast');
        t.textContent = '正在准备 EPUB 电子书...';
        t.classList.add('show');
        const r = await fetch('epub.enc.json');
        const ej = await r.json();
        const key = await deriveAesKey(__unlockedPin, ej.salt);
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToU8(ej.iv) },
          key,
          b64ToU8(ej.ct)
        );
        const blob = new Blob([plainBuf], { type: 'application/epub+zip' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '高情商恋爱沟通实战全书.epub';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => t.classList.remove('show'), 1500);
      } catch (e) {
        alert('下载失败: ' + e.message);
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const saved = localStorage.getItem('dy_saved_pin_v1');
      if (saved && await tryUnlock(saved, true)) return;
      const inp = document.getElementById('pinInput');
      const btn = document.getElementById('unlockBtn');
      inp.addEventListener('input', () => {
        document.getElementById('lockErr').textContent = '';
        if (inp.value.length === 4) tryUnlock(inp.value, false);
      });
      btn.addEventListener('click', () => tryUnlock(inp.value, false));
    });

  <script>window.__bootBookApp = function() {

  const DATA = window.__BOOK_DATA__;
  const chapters = DATA.chapters;
  const cards = DATA.cards;

  let activeTab = 'ai';

  let aiStage = '日常升温';
  let aiImageDataUrl = '';
  let aiLoading = false;
  let aiHistory = JSON.parse(localStorage.getItem('dy_ai_history_v1') || '[]');
  let cachedTunnelBase = null;
  const AI_STAGES = ['日常升温', '黄毛张力', '初识破冰', '脱单扩圈', '暧昧拉扯', '她有情绪/喊累', '想邀约见面', '冷淡/慢回破局', '相亲/谈婚'];

  async function resolveApiBase() {
    if (location.hostname.endsWith('github.io')) {
      if (cachedTunnelBase) return cachedTunnelBase;
      const r = await fetch('./endpoint.json?t=' + Date.now());
      const j = await r.json();
      cachedTunnelBase = (j.api_base || '').replace(/\/$/, '');
      return cachedTunnelBase;
    }
    return '';
  }

  window.setAiStage = function(st) {
    aiStage = st;
    document.querySelectorAll('.ai-stage-pill').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-st') === st);
    });
  };

  window.pasteHerMsg = async function() {
    try {
      const txt = await navigator.clipboard.readText();
      if (txt) {
        document.getElementById('herMsgInput').value = txt;
        showToast('已粘贴剪贴板内容');
      }
    } catch (e) {
      document.getElementById('herMsgInput').focus();
      showToast('请长按输入框点击粘贴');
    }
  };

  window.handleScreenshotSelect = function(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const maxW = 1080;
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        aiImageDataUrl = canvas.toDataURL('image/jpeg', 0.82);
        renderMain();
        showToast('✓ 已载入聊天截图');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.clearAiImage = function() {
    aiImageDataUrl = '';
    renderMain();
  };

  window.saveAiReplyToFav = function(trigger, reply) {
    customNotes.unshift({ id: 'C' + Date.now(), trigger: trigger || 'AI军师定制回复', reply: reply });
    localStorage.setItem('dy_custom_notes', JSON.stringify(customNotes));
    showToast('★ 已存入收藏夹');
  };

  window.askAiCoach = async function(refineGoal) {
    if (aiLoading) return;
    const msgEl = document.getElementById('herMsgInput');
    const ctxEl = document.getElementById('herCtxInput');
    const herMsg = msgEl ? msgEl.value.trim() : (aiHistory[0] ? aiHistory[0].her_message : '');
    const extraCtx = ctxEl ? ctxEl.value.trim() : '';

    if (!herMsg && !aiImageDataUrl) {
      showToast('请粘贴女生发来的话，或上传一张微信聊天截图');
      return;
    }

    aiLoading = true;
    const btn = document.getElementById('aiGoBtn');
    if (btn) { btn.disabled = true; btn.textContent = '🧠 正在检索逐字稿真人原话定制大白话回复...'; }

    try {
      const base = await resolveApiBase();
      const pin = window.__ACTIVE_PIN__ || localStorage.getItem('dy_saved_pin_v1') || '1234';
      const resp = await fetch(base + '/api/coach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Pin': pin },
        body: JSON.stringify({
          her_message: herMsg,
          context: extraCtx,
          stage: aiStage,
          goal: refineGoal || '',
          image_data_url: aiImageDataUrl,
          prev_result: refineGoal && aiHistory[0] ? aiHistory[0].res.replies : null
        })
      });
      const res = await resp.json();
      if (!res.ok) throw new Error(res.error || '请求失败');

      aiHistory.unshift({
        ts: Date.now(),
        her_message: herMsg || '📸 [微信聊天截图识别]',
        stage: aiStage,
        goal: refineGoal || '',
        res: res
      });
      aiHistory = aiHistory.slice(0, 12);
      localStorage.setItem('dy_ai_history_v1', JSON.stringify(aiHistory));
      aiLoading = false;
      renderMain();
    } catch (err) {
      cachedTunnelBase = null;
      aiLoading = false;
      if (btn) { btn.disabled = false; btn.textContent = '✨ 让军师帮我回'; }
      alert('连接家里AI军师失败：' + err.message + '\n（请确认家里电脑开机联网，或稍后刷新重试）');
    }
  };

  function renderAiTabHTML() {
    const curVal = document.getElementById('herMsgInput') ? document.getElementById('herMsgInput').value : '';
    const curCtx = document.getElementById('herCtxInput') ? document.getElementById('herCtxInput').value : '';
    return `
      <div class="ai-panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800;font-size:1.02rem">🤖 AI 实时回话军师</div>
          <span style="font-size:0.74rem;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:99px;font-weight:600">1006条逐字稿真人原话直通</span>
        </div>
        <div class="pill-scroll" style="padding:8px 0 4px">
          ${AI_STAGES.map(st => `<button class="pill ai-stage-pill ${aiStage === st ? 'active' : ''}" data-st="${st}" onclick="setAiStage('${st}')">${st}</button>`).join('')}

  window.copyReply = function(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast('✓ 已复制话术，可直接去微信粘贴')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  };

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      showToast('✓ 已复制话术，可直接去微信粘贴');
    } catch (e) {
      showToast('请长按文字复制');
    }
    document.body.removeChild(ta);
  }

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function hi(str, q) {
    const safe = esc(str);
    if (!q) return safe;
    const terms = q.trim().split(/\s+/).filter(Boolean);
    let out = safe;
    terms.forEach(term => {
      const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }

      starredIds.add(id);

      btn.textContent = '★';

  window.parseHookReply = function(raw) {
    const s = String(raw || '').trim();
    const idx = s.indexOf('||');
    if (idx === -1) return { step1: s, cond: '', step2: '' };
    const step1 = s.slice(0, idx).trim();
    const rest = s.slice(idx + 2).trim();
    const cIdx = rest.search(/[：:]/);
    if (cIdx !== -1 && cIdx < 24) {
      return {
        step1: step1,
        cond: rest.slice(0, cIdx).trim(),
        step2: rest.slice(cIdx + 1).trim().replace(/^[「『“"']+|[」』”"']+$/g, '')
      };
    }
    return { step1: step1, cond: '她接话后再回', step2: rest.replace(/^[「『“"']+|[」』”"']+$/g, '') };
  };

  function filterCards() {
    const q = searchQuery.trim().toLowerCase();
    return cards.filter(c => {

      if (!q) return true;
      const hay = [
        c.trigger, c.category, c.stage, c.subtext,
        (c.keywords || []).join(' '),
        c.humorous_reply, c.warm_reply, c.confident_reply, c.followup_tip
      ].join(' ').toLowerCase();
      return q.split(/\s+/).every(term => hay.includes(term));
    });

      const stages = [
        { title: '🔥 总是太客气被发好人卡（破规矩期·军师Jason黄毛思维）', desc: '条件不错却聊成老实同事/好哥哥？学会轻坏调侃、情绪过山车与破框张力', cat: '黄毛张力', ch: 10 },
        { title: '⓪ 圈子窄没资源 / 朋友圈吸引（扩圈期·恋爱雪邪修）', desc: '社交圈封闭认识不到优质女生、想立高吸引力朋友圈并甄别内核稳定好姑娘', cat: '脱单扩圈', ch: 9 },
        { title: '① 刚加微信 / 相亲初识（破冰期）', desc: '不知道第一句发什么、怕一问一答查户口冷场', cat: '初识破冰', ch: 2 },
        { title: '② 日常微信闲聊（升温期）', desc: '早晚安、在干嘛、她发美食/自拍，想聊出轻松暧昧氛围', cat: '测试接招', ch: 4 },
        { title: '③ 判断她喜不喜欢我（解码期）', desc: '拿不准她是在矜持试探还是委婉拒绝，想测出真实好感度', cat: '好感信号', ch: 3 },
        { title: '④ 她喊累 / 生病 / 心情不好（共情期）', desc: '不想干巴巴说“多喝热水”，想真正走进她心里建立偏爱感', cat: '关心安慰', ch: 5 },
        { title: '⑤ 准备约出来见面 / 升级关系（邀约期）', desc: '怕约被拒尴尬，想知道怎么低压力邀约、怎么安排约会转场', cat: '线下邀约', ch: 6 },
        { title: '⑥ 她突然冷淡 / 慢回 / 闹小脾气（破局期）', desc: '消息回得慢、气氛变淡或吵架了，想体面破冰不卑微', cat: '冷淡破局', ch: 7 },
        { title: '⑦ 相亲深入沟通与谈婚论嫁（长期期）', desc: '摸底三观家庭、应对长辈谈彩礼与现实条件博弈', cat: '相亲谈婚', ch: 8 },
        { title: '⑧ 稳住自我内核（底层心态基石）', desc: '容易患得患失、秒回讨好、需求感太强？先花5分钟调正心态', cat: '日常闲聊', ch: 1 }
      ];
      main.innerHTML = `
        <div class="ch-header-card">
          <div class="ch-kicker">QUICK NAVIGATOR · 关系阶段急救地图</div>
          <h2 class="ch-title" style="font-size:1.15rem">你和她现在处于哪个阶段？</h2>
          <p class="ch-sub" style="margin-bottom:0">点选对应情境，直达精选话术库或核心教程章节：</p>
        </div>
        <div class="stage-grid">
          ${stages.map(s => `
            <div class="stage-card">
              <h4>${s.title}</h4>
              <p>${s.desc}</p>
              <div style="display:flex;gap:8px">
                <button class="icon-btn" style="flex:1;color:var(--primary);border-color:var(--primary)" onclick="jumpToCatFromBook('${s.cat}')">⚡ 查【${s.cat}】话术</button>
                <button class="icon-btn" style="flex:1" onclick="openChapter(${s.ch})">📖 读第 ${s.ch} 章教程</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    } else if (activeTab === 'fav') {
      const favCards = cards.filter(c => starredIds.has(c.id));
      main.innerHTML = `
        <div class="custom-form">
          <div style="font-weight:700;font-size:0.95rem;margin-bottom:8px">✍️ 添加我的专属备用话术</div>
          <input id="custTrigger" placeholder="场景备注（例：她周末加班结束怎么接）" />
          <textarea id="custReply" rows="2" placeholder="输入你觉得好用的高情商回复..."></textarea>
          <button class="icon-btn" style="width:100%;background:var(--primary);color:#fff;border:none;padding:9px" onclick="addCustomNote()">+ 保存到本机收藏夹</button>
        </div>
        ${customNotes.map(n => `
          <div class="sc-card">
            <div class="sc-top">
              <span class="badge-cat">个人自建</span>
              <button class="icon-btn" style="padding:2px 8px;font-size:0.72rem" onclick="delCustomNote('${n.id}')">删除</button>
            </div>
            <div class="sc-trigger">${esc(n.trigger)}</div>
            ${window.renderHookBoxHTML('reply-warm', '⭐ 专属话术', n.reply, '', '')}
          </div>
        `).join('')}
        <div class="stats-bar"><span>已标星收藏的话术卡（${favCards.length} 张）</span></div>
        ${favCards.length ? favCards.map(c => renderCardHTML(c, '')).join('') : '<div style="text-align:center;padding:36px 20px;color:var(--text-3)">还没有收藏卡片，在「搜话术」右上角点 ☆ 即可收藏常用金句</div>'}
      `;
    }
  }

  window.switchTab = function(tab) {
    activeTab = tab;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    renderHeaderControls();
    renderMain();
  };

  window.toggleTheme = function() {
    theme = theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('dy_theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
  };

  window.cycleFont = function() {
    const scales = [1, 1.1, 1.2];
    const idx = (scales.indexOf(fontScale) + 1) % scales.length;
    fontScale = scales[idx];
    document.documentElement.style.setProperty('--font-scale', fontScale);
    localStorage.setItem('dy_font_scale', String(fontScale));
    showToast(fontScale === 1 ? '字号：标准' : (fontScale === 1.1 ? '字号：大号' : '字号：特大'));
  };

  (function() {
    document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
    const inp = document.getElementById('searchInput');
    const clr = document.getElementById('clearBtn');
    inp.addEventListener('input', function() {
      searchQuery = inp.value;
      clr.style.display = searchQuery ? 'flex' : 'none';
      renderMain();
    });
    clr.addEventListener('click', function() {
      searchQuery = '';
      inp.value = '';
      clr.style.display = 'none';
      renderMain();
      inp.focus();
    });
    renderHeaderControls();
    renderMain();
  })();

};</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
